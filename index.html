  --line:#E6E3DC; --line-2:#D9D5CC;
  --brand:#1E4D57; --brand-ink:#FFFFFF; --brand-soft:#E3EEEE; --brand-2:#2C6B78;
  --accent:#E07B39; --accent-ink:#9A4513; --accent-soft:#FCEBDC;
  --good:#2F7A57; --good-soft:#E0F1E8; --warn:#A8521A; --warn-soft:#FBE9DB; --crit:#B3261E; --crit-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(20,38,43,.05),0 8px 24px rgba(20,38,43,.06);
  --shadow-lg:0 -8px 40px rgba(20,38,43,.18);
  --scrim:rgba(13,26,30,.42);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D181B; --bg-2:#132226; --card:#16262A; --card-2:#1B2D32; --ink:#EAF2F2; --ink-2:#C5D4D6; --sub:#93A7AB;
  --line:#22363B; --line-2:#2D454B;
  --brand:#7CC3CB; --brand-ink:#0B1A1D; --brand-soft:#1B363B; --brand-2:#9AD3DA;
  --accent:#F2A066; --accent-ink:#F6B98B; --accent-soft:#3A2819;
  --good:#7FD1A6; --good-soft:#163428; --warn:#F2A877; --warn-soft:#3A271A; --crit:#F2958E; --crit-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 -8px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D181B; --bg-2:#132226; --card:#16262A; --card-2:#1B2D32; --ink:#EAF2F2; --ink-2:#C5D4D6; --sub:#93A7AB;
  --line:#22363B; --line-2:#2D454B;
  --brand:#7CC3CB; --brand-ink:#0B1A1D; --brand-soft:#1B363B; --brand-2:#9AD3DA;
  --accent:#F2A066; --accent-ink:#F6B98B; --accent-soft:#3A2819;
  --good:#7FD1A6; --good-soft:#163428; --warn:#F2A877; --warn-soft:#3A271A; --crit:#F2958E; --crit-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 -8px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
:root[data-text="large"]{font-size:18.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:0;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand)}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.screen{padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.screen.noTabs{padding-bottom:40px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);display:flex;align-items:center;gap:10px;min-height:56px;padding:calc(6px + env(safe-area-inset-top,0px)) 4px 6px;margin:0 -16px;padding-inline:12px}
.bar .t{font-weight:650;font-size:1.0625rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar .side{width:84px;display:flex}
.bar .side.r{justify-content:flex-end}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--bg-2)}
.iconbtn svg{width:24px;height:24px}
.textbtn{color:var(--brand);font-weight:600;padding:10px 8px;border-radius:10px}
.largetitle{font-family:var(--display);font-size:2.05rem;line-height:1.08;font-weight:750;letter-spacing:-.022em;margin:6px 2px 4px;text-wrap:balance}
.subtitle{color:var(--sub);margin:0 2px 18px;font-size:.98rem}

.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:750;font-size:1.25rem;letter-spacing:-.02em;color:var(--ink)}
.wordmark .mk{width:30px;height:30px;border-radius:50%;background:#1E4D57;display:grid;place-items:center}
.wordmark .mk svg{width:24px;height:24px}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.section{margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.sechead h2{font-size:1.28rem;font-weight:700;letter-spacing:-.012em;margin:0}
.sechead .more{color:var(--brand);font-weight:600;font-size:.95rem;padding:6px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--brand-soft);box-shadow:none}
.card.accent{background:var(--accent-soft);box-shadow:none}
.muted{color:var(--sub)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
.b{font-weight:650}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}

.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:13px 16px;position:relative;width:100%;text-align:left;min-height:58px}
.li+.li::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--line)}
.li.noicon+.li.noicon::before{left:16px}
button.li:active{background:var(--card-2)}
.li .tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.li .tile svg{width:21px;height:21px}
.tile.c-accent{background:var(--accent-soft);color:var(--accent-ink)}
.tile.c-good{background:var(--good-soft);color:var(--good)}
.tile.c-warn{background:var(--warn-soft);color:var(--warn)}
.tile.c-crit{background:var(--crit-soft);color:var(--crit)}
.tile.c-plain{background:var(--bg-2);color:var(--ink-2)}
.li .main{flex:1;min-width:0}
.li .main .ttl{font-weight:600;font-size:1rem;line-height:1.3}
.li .main .sub{color:var(--sub);font-size:.88rem;line-height:1.35;margin-top:2px}
.li .chev{color:var(--line-2);width:18px;height:18px;flex:none}
.li .val{color:var(--sub);font-size:.92rem}
.li.done .ttl{text-decoration:line-through;color:var(--sub)}

.ti{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:13px 14px 13px 12px;position:relative;width:100%;text-align:left}
.ti+.ti::before{content:"";position:absolute;top:0;left:76px;right:0;border-top:1px solid var(--line)}
.ti .when{text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:650;font-size:.95rem;line-height:1.15}
.ti .when small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;letter-spacing:.02em;text-transform:uppercase;margin-top:2px}
.ti .when svg{width:22px;height:22px;color:var(--sub)}
.ti .body{min-width:0}
.ti .body .ttl{font-weight:600;line-height:1.3}
.ti .body .sub{color:var(--sub);font-size:.86rem;margin-top:2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ti .end{display:flex;align-items:center;gap:8px}
.ti.done .ttl{text-decoration:line-through;color:var(--sub)}
.ti.done{opacity:.72}

.av{--c:#C8D3D5;width:30px;height:30px;border-radius:50%;background:var(--c);color:#14262B;display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;overflow:hidden;border:2px solid var(--card)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:1.5rem}
.av.xl{width:84px;height:84px;font-size:2rem}
.av.md{width:40px;height:40px;font-size:1rem}
.avstack{display:flex}.avstack .av{margin-left:-8px}.avstack .av:first-child{margin-left:0}
.av.empty{background:transparent;border:2px dashed var(--line-2);color:var(--sub)}

.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.chk[aria-checked="true"] svg{opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.92rem;font-weight:550;color:var(--ink-2)}
.chip svg{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink)}
.claim{font-size:.82rem;font-weight:650;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:6px 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;padding:0 20px;font-weight:650;font-size:1.02rem;background:var(--brand);color:var(--brand-ink);width:100%}
.btn:active{filter:brightness(.94)}
.btn svg{width:20px;height:20px}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line-2)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{min-height:40px;font-size:.92rem;border-radius:12px;padding:0 14px;width:auto}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:.86rem;font-weight:600;color:var(--ink-2);margin-left:2px}
.input,.select,.textarea{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);padding:12px 14px;font-size:1.02rem;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand)}
.textarea{min-height:110px;resize:vertical;line-height:1.45}
.hint{font-size:.82rem;color:var(--sub);margin-left:2px}
.err{font-size:.86rem;color:var(--crit);margin-left:2px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg-2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.hero{background:linear-gradient(160deg,#1E4D57 0%,#25606C 100%);color:#F6F2EA;border-radius:26px;padding:18px;box-shadow:0 10px 30px rgba(30,77,87,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(244,162,97,.35),transparent 70%)}
.hero .who{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero .av{border-color:rgba(255,255,255,.85)}
.hero h2{margin:0;font-size:1.5rem;font-weight:750;letter-spacing:-.015em}
.hero .meta{opacity:.82;font-size:.9rem}
.hero .quote{margin-top:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:11px 13px;font-size:.93rem;line-height:1.4;position:relative;z-index:1}
.hero .quote small{display:block;opacity:.75;margin-top:4px;font-size:.78rem}
.hero .checkin{margin-top:12px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .checkin .btn{background:#F4A261;color:#14262B;min-height:44px;font-size:.95rem;border-radius:14px}
.hero .checkin .ok{display:flex;align-items:center;gap:8px;font-size:.9rem;background:rgba(127,209,166,.18);color:#CFF2DE;border-radius:12px;padding:9px 12px;flex:1}
.hero .checkin .ok svg{width:18px;height:18px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:left;min-width:0}
.stat .n{font-family:var(--display);font-size:1.6rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--sub);line-height:1.25}
.stat.warn .n{color:var(--warn)}
.stat.good .n{color:var(--good)}

.nudge{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;text-align:left;width:100%}
.nudge .tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.nudge .tile svg{width:19px;height:19px}
.nudge .ttl{font-weight:600;font-size:.95rem;line-height:1.3}
.nudge .sub{font-size:.85rem;color:var(--sub);margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 84%}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;color:var(--sub);font-size:.72rem;font-weight:600}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--brand)}
.fab{justify-self:center;width:62px;height:62px;border-radius:22px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(30,77,87,.38);transform:translateY(-14px)}
.fab svg{width:30px;height:30px}
.fab:active{transform:translateY(-12px) scale(.97)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fadein .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);max-height:92%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:9px auto 2px}
.sheet .sh{display:flex;align-items:center;padding:4px 10px 6px 18px}
.sheet .sh h3{flex:1;margin:0;font-size:1.15rem;font-weight:700}
.sheet .sb{overflow:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{animation:none}}

.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.typeb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--card);border:1.5px solid transparent;font-size:.76rem;font-weight:600;color:var(--ink-2);text-align:center}
.typeb .tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.typeb .tile svg{width:22px;height:22px}
.typeb[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.95rem;font-weight:550;max-width:min(92vw,420px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadein .2s ease;display:flex;align-items:center;gap:10px}
.toast svg{width:18px;height:18px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 18px;color:var(--sub)}
.empty .art{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:4px}
.empty .art svg{width:32px;height:32px}
.empty b{color:var(--ink);font-size:1.02rem}

.auth{min-height:100vh;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px))}
.auth .art{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 0}
.auth h1{font-family:var(--display);font-size:2.2rem;line-height:1.06;font-weight:780;letter-spacing:-.025em;margin:0;text-wrap:balance}
.auth p.lead{font-size:1.06rem;color:var(--ink-2);margin:0}
.slides{display:flex;gap:6px;justify-content:center;margin:8px 0 18px}
.slides i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.slides i.on{width:22px;border-radius:4px;background:var(--brand)}
.illus{width:100%;max-width:330px;align-self:center;aspect-ratio:1/0.82}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:300px;margin:0 auto;align-self:center}
.pinpad button svg{width:26px;height:26px}
.pinpad button{width:100%;height:68px;border-radius:22px;font-size:1.6rem;font-weight:600;background:var(--card);box-shadow:var(--shadow)}
.pindots{display:flex;gap:16px;justify-content:center;margin:22px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.on{background:var(--brand)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.steps i.on{background:var(--brand)}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:auto 1fr 36px;gap:10px;align-items:center;font-size:.92rem}
.barrow .track{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.barrow .fill{height:100%;border-radius:999px;background:var(--brand-2)}
.barrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;border:2px solid transparent}
.day .dn{font-size:.7rem;color:var(--sub);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-weight:700;font-size:1.05rem}
.day.today{border-color:var(--brand)}
.day.gap{background:var(--warn-soft)}
.day .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.day .dots .av{width:22px;height:22px;font-size:.62rem;border-width:1.5px}
.day.sel{outline:2px solid var(--accent)}
.money{font-variant-numeric:tabular-nums;font-weight:650}
.brief{white-space:pre-wrap;line-height:1.55;font-size:.98rem}
.brief h4{margin:14px 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.brief h4:first-child{margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.strip i{height:22px;border-radius:5px;background:var(--bg-2)}
.strip i.l1{background:color-mix(in srgb,var(--warn) 35%,var(--bg-2))}
.strip i.l2{background:color-mix(in srgb,var(--warn) 70%,var(--bg-2))}
.strip i.ok{background:color-mix(in srgb,var(--good) 45%,var(--bg-2))}
.companion{min-height:100vh;background:#FBF5EC;color:#14262B;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 30px;display:flex;flex-direction:column;gap:18px}
.companion .day1{font-family:var(--display);font-size:2.9rem;line-height:1.02;font-weight:800;letter-spacing:-.02em}
.companion .greet{font-size:1.4rem;color:#3c5a60}
.companion .ev{display:flex;gap:18px;align-items:baseline;font-size:1.55rem;border-top:2px solid #E6DCCB;padding-top:14px;line-height:1.25}
.companion .ev b{min-width:5.2em;color:#1E4D57;font-variant-numeric:tabular-nums}
.companion .love{font-size:1.25rem;background:#F4A26133;border-radius:20px;padding:16px 18px;line-height:1.35}
.companion .exit{align-self:flex-start;color:#1E4D57;font-weight:650;padding:8px 0}
.planrow{display:flex;gap:10px;align-items:center}
.photo{width:100%;border-radius:16px;display:block}
.qr{display:grid;place-items:center}
.disclaim{font-size:.8rem;color:var(--sub);line-height:1.4;margin:12px 4px 0}
.plan-card{border:2px solid var(--line);border-radius:22px;padding:18px;background:var(--card)}
.plan-card.plus{border-color:var(--brand);box-shadow:0 10px 30px rgba(30,77,87,.15)}
.plan-card .price{font-family:var(--display);font-size:1.9rem;font-weight:780;letter-spacing:-.02em}
.plan-card ul{margin:10px 0 0;padding-left:20px;line-height:1.7}

.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.bubble{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:.97rem;animation:pop .22s ease-out both}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.bubble.ai{align-self:flex-start;background:var(--card);color:var(--ink);border-bottom-left-radius:6px;box-shadow:var(--shadow-1, 0 1px 2px rgba(22,50,58,.08))}
.bubble.ai .list .li{padding-left:0}
.aicard{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--brand-soft)}
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:blink 1.1s infinite both}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chatin{position:sticky;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);margin-top:8px}
.chatin .textarea{flex:1;min-height:46px;max-height:140px;border-radius:22px;padding:11px 16px;resize:none}
.chatin .send{flex:none;width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transition:transform .15s ease}
.chatin .send:active{transform:scale(.94)}.chatin .send svg{width:22px;height:22px}
.chatin .thumb{position:relative;flex:none}.chatin .thumb img{width:46px;height:46px;object-fit:cover;border-radius:12px}
.chatin .thumb .iconbtn{position:absolute;top:-10px;right:-10px;width:26px;height:26px;background:var(--card);border-radius:50%}
.askbar{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;border-radius:16px;background:var(--card);color:var(--sub);text-align:left;box-shadow:0 1px 2px rgba(22,50,58,.08);border:1px solid var(--line)}
.askbar svg{width:20px;height:20px;color:var(--accent, var(--brand))}
.routine.alldone{opacity:.75}
.rstep:active .chk{transform:scale(.92)}
button,.li,.chip,.stat,.claim{transition:background-color .2s ease,transform .15s ease,opacity .2s ease,border-color .2s ease}
button:active:not(:disabled),.chip:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cmsg{display:flex;align-items:flex-end;gap:8px}
.cmsg.me{justify-content:flex-end}
.cmsg .bubble{max-width:80%}
.bubble .who{font-size:.78rem;font-weight:700;color:var(--brand);margin-bottom:2px}
.bubble .meta{font-size:.7rem;opacity:.7;margin-top:4px;text-align:right}
.bubble.me .meta .textbtn{color:inherit;text-decoration:underline}
.cimg{display:block;max-width:100%;border-radius:12px;margin:2px 0 6px}
.av.sq{border-radius:10px}
.jobref{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--brand-soft);color:var(--ink);text-align:left;font-size:.88rem;font-weight:600}
.bubble.me .jobref{background:rgba(255,255,255,.16);color:inherit}
.jobref span:nth-child(2){flex:1}
.daysep{text-align:center;margin:6px 0}.daysep span{font-size:.72rem;font-weight:650;color:var(--sub);background:var(--bg-2);padding:3px 10px;border-radius:999px}
.syncbar{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--good);background:var(--good-soft);padding:8px 12px;border-radius:12px}
.syncbar .textbtn{margin-left:auto}
.chips.hsc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.hsc::-webkit-scrollbar{display:none}.chips.hsc .chip{flex:none}
.chatin.ontab{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.tab{position:relative}
.tabdot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:.68rem;font-style:normal;font-weight:700;display:grid;place-items:center}
.cmsg .bubble.me{white-space:normal}
.pwmeter{display:flex;align-items:center;gap:10px;min-height:18px;margin-top:6px}
.pwmeter .track{flex:1;height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden}
.pwmeter .fill{display:block;height:100%;border-radius:3px;transition:width .25s ease}
.pwmeter .fill.crit{background:var(--crit)}.pwmeter .fill.warn{background:var(--warn)}.pwmeter .fill.good{background:var(--good)}
.reckey{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;font-weight:700;letter-spacing:.08em}
.reckey span{background:var(--bg-2);border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center}
.reckey small{font-size:.62rem;color:var(--sub);font-weight:600;letter-spacing:0}
.agree .textbtn{padding:0;font-size:inherit;text-decoration:underline}
.legalov{position:fixed;inset:0;z-index:60}
.legalov .scrim{position:absolute;inset:0}
.mt4{margin-top:4px}
.srclink{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.sug.decided{opacity:.72}
.claim.ghostish{background:transparent;color:var(--sub);border:1px solid var(--line-2)}
.seg.wrap{flex-wrap:wrap;height:auto}
.seg.wrap button{flex:1 1 auto;min-height:38px}
.card.alert{padding:12px 14px;border:2px solid var(--warn);box-shadow:none}
.card.alert.crit{border-color:var(--crit);background:var(--crit-soft)}
.cbtns{display:flex;flex-direction:column;gap:14px;margin:18px 0}
.cbig{display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;border-radius:24px;font-size:1.5rem;font-weight:750;color:#fff;padding:12px 16px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cbig svg{width:30px;height:30px}
.cbig.ok{background:#2F7A57;min-height:110px;font-size:1.8rem}
.cbig.call{background:#1E4D57;flex:1;font-size:1.2rem}
.cbig.help{background:#B3261E;flex:1;font-size:1.2rem}
.crow{display:flex;gap:12px}
.cok{display:flex;align-items:center;gap:12px;padding:20px;border-radius:24px;background:#E0F1E8;color:#1d5a3e;font-size:1.3rem;font-weight:700}
.cok svg{width:34px;height:34px;flex:none}
.c999{padding:16px;border-radius:18px;background:#FBE3E1;color:#7c1a14;font-size:1.25rem;line-height:1.4;text-align:center}
.sharebar{height:8px;border-radius:4px;background:var(--bg-2);overflow:hidden}
.sharebar span{display:block;height:100%;border-radius:4px;background:var(--brand)}
.sechead h2 .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:.8rem;margin-right:8px;vertical-align:1px}
@media print{body *{visibility:hidden!important}#passport-print,#passport-print *{visibility:visible!important}#passport-print{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}}
.ti.nowhen{grid-template-columns:1fr auto;padding-left:16px}
.ti .kic{width:16px;height:16px;vertical-align:-2px;margin-right:6px;color:var(--brand)}
.ti.late .when{color:var(--warn)}
.ti .latetxt{color:var(--warn)}
.you{font-size:.72rem;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:4px 8px;border-radius:999px}
.swipe{position:relative;overflow:hidden}
.swipe+.swipe .ti{border-top:1px solid var(--line)}
.swipe .ti{background:var(--card);position:relative;z-index:1;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.swipe.moving .ti{transition:none}
.sbg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:700;font-size:.9rem;color:#fff;background:var(--warn)}
.swipe.toR .sbg{background:var(--good)}
.sbg span{display:flex;align-items:center;gap:6px;opacity:.55;transition:opacity .15s}.sbg svg{width:18px;height:18px}
.swipe.arm .sbg span{opacity:1}
.swipe.toR .sbg .sr,.swipe:not(.toR) .sbg .sl{visibility:hidden}
.toast .undo{margin-left:10px;font-weight:750;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.chip .cnt{font-size:.75rem;opacity:.7;margin-left:2px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.brief1{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;line-height:1.4;margin:10px 0 2px;opacity:.92}
.brief1 svg{width:18px;height:18px;flex:none;margin-top:1px;color:#F4A261}
.memgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{background:var(--card);border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 1px 2px rgba(22,50,58,.08);display:flex;flex-direction:column}
.mem img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mem .mt{padding:10px 12px;font-size:.9rem;line-height:1.4}
.memgrid>.card{grid-column:1/-1}
.memimg{display:grid;place-items:center;gap:6px;min-height:140px;border:2px dashed var(--line-2);border-radius:16px;color:var(--sub);cursor:pointer;overflow:hidden}
.memimg img{width:100%;max-height:260px;object-fit:cover}.memimg svg{width:28px;height:28px}
.cmem{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px;padding:12px;font-size:1.15rem;line-height:1.35;color:#16323A;margin-top:14px}
.cmem img{width:96px;height:96px;object-fit:cover;border-radius:14px;flex:none}

:root{
  --bg:#F5F0E8; --bg-2:#ECE4D8; --card:#FFFDF9; --card-2:#FAF6EF; --ink:#16323A; --ink-2:#34525A; --sub:#5E7479;
  --line:#E8E0D3; --line-2:#D8CEBE; --brand:#1E4D57; --brand-soft:#E2EDEC; --accent:#D9722F; --accent-soft:#FBE8D8;
  --font:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:'Bricolage Grotesque','Atkinson Hyperlegible',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(22,50,58,.06),0 6px 20px rgba(22,50,58,.06);
  --r-lg:24px; --r-md:18px;
}
html{font-size:17px}
:root[data-text="large"]{font-size:19.5px}
:root[data-text="xl"]{font-size:22px}
:root[data-text="normal"]{font-size:17px}
body{font-family:var(--font);letter-spacing:.005em}
h1,h2,h3,.largetitle,.bar .t,.hero h2,.wordmark,.stat .n,.auth h1,.pc-n{font-family:var(--display);letter-spacing:-.015em}
.largetitle{font-weight:750;line-height:1.08}
.sechead h2{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em}
.btn,.tab span,.chip,.claim,.seg button{font-family:var(--font);font-weight:700}
.btn{min-height:52px}
.chip{min-height:40px}
.seg button{min-height:42px}
.li{min-height:60px}
.tab{min-height:56px}.tab span{font-size:.78rem}
:root[data-text="xl"] .hubgrid{grid-template-columns:repeat(2,1fr)}
:root[data-text="xl"] .quick{grid-template-columns:repeat(2,1fr)}
:root[data-contrast="high"]{--ink:#000;--ink-2:#111;--sub:#2b2b2b;--line:#8a8a8a;--line-2:#555;--brand:#0B3640;--brand-soft:#D3E6E6;--bg:#FFFFFF;--card:#FFFFFF;--accent:#A84A0E}
:root[data-contrast="high"][data-theme="dark"],:root[data-contrast="high"]:not([data-theme="light"]) .x{}
@media (prefers-color-scheme:dark){:root[data-contrast="high"]:not([data-theme="light"]){--ink:#fff;--ink-2:#f2f2f2;--sub:#d6d6d6;--bg:#000;--card:#0b0b0b;--line:#777;--line-2:#999;--brand:#9FE3EA;--brand-soft:#0f2a2e}}
:root[data-contrast="high"][data-theme="dark"]{--ink:#fff;--ink-2:#f2f2f2;--sub:#d6d6d6;--bg:#000;--card:#0b0b0b;--line:#777;--line-2:#999;--brand:#9FE3EA;--brand-soft:#0f2a2e}
:root[data-contrast="high"] .card,:root[data-contrast="high"] .list,:root[data-contrast="high"] .hubtile{border:1.5px solid var(--line)}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.personcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--brand);color:#F6F2EA;border-radius:var(--r-lg);padding:14px 16px;margin-top:6px;box-shadow:var(--shadow)}
.personcard .grow{display:flex;flex-direction:column;min-width:0}
.pc-n{font-size:1.35rem;font-weight:750}.pc-s{font-size:.88rem;opacity:.8}
.pc-sw{font-size:.82rem;font-weight:700;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px}
.hubgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hubtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;background:var(--card);border-radius:var(--r-md);padding:14px 6px 12px;min-height:104px;box-shadow:var(--shadow);text-align:center}
.hubtile .hl{font-size:.86rem;font-weight:700;line-height:1.2;color:var(--ink)}
.hi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.hi svg{width:24px;height:24px}
.hi.c-accent{background:var(--accent-soft);color:var(--accent)}.hi.c-good{background:var(--good-soft);color:var(--good)}.hi.c-crit{background:var(--crit-soft);color:var(--crit)}.hi.c-warn{background:var(--warn-soft);color:var(--warn)}.hi.c-plain{background:var(--bg-2);color:var(--ink-2)}
.hb{position:absolute;top:8px;right:10px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:.72rem;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 5px}
.hubtile:active{transform:scale(.97)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:var(--r-md);padding:12px 4px;box-shadow:var(--shadow);font-size:.8rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.2}
.qa .hi{width:42px;height:42px;border-radius:13px}
.ch{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:1.05rem}.ch svg{width:20px;height:20px;color:var(--brand)}
.actcard{padding:14px 16px}
.wbrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.wbn{font-family:var(--display);font-size:1.8rem;font-weight:750;color:var(--brand)}
.wbcell .up{color:var(--good);font-weight:700}.wbcell .down{color:var(--warn);font-weight:700}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px}.spark span{flex:1;background:var(--brand);border-radius:4px 4px 0 0;opacity:.85}
.range{width:100%;accent-color:var(--brand);height:36px}
.callbtn{flex:none;min-width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-weight:800;text-decoration:none;margin-left:6px}
.callbtn svg{width:22px;height:22px}.callbtn.crit{background:var(--crit-soft);color:var(--crit)}
.givebtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--line-2);font-weight:700;background:var(--card)}
.givebtn svg{width:18px;height:18px}.givebtn small{font-weight:500;font-size:.75rem;opacity:.85}
.givebtn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.reacts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.rct{font-size:.9rem;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.05);line-height:1.6}
.bubble.me .rct{background:rgba(255,255,255,.18)}
.rct b{font-size:.75rem;margin-left:3px}.rct.on{outline:2px solid var(--brand)}
.speakbtn svg{width:18px;height:18px}
.cread{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:20px;background:#fff;color:#1E4D57;font-size:1.2rem;font-weight:750;margin-top:14px;border:2px solid #1E4D57}
.cread svg{width:24px;height:24px}
.aa{font-family:var(--display);font-weight:750;font-size:1.05rem;color:var(--brand)}
.tav{background:var(--brand)!important;padding:5px}.tav svg{width:100%;height:100%}
.personcard{background:linear-gradient(135deg,#1E4D57,#2C6B78)!important;color:#F6F2EA!important}
.cc{margin-top:12px;padding:14px 16px}
.cc-h{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin-bottom:6px}
.cc-h svg{width:24px;height:24px;color:var(--good)}
.cc.ok{background:var(--good-soft)}
.cc-n{display:grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:.9rem}
.gap{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.card.gap{border-top:0}
.gap .hi{width:38px;height:38px;border-radius:12px}.gap .hi svg{width:20px;height:20px}
.cov{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cov span{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;background:var(--good-soft);color:var(--good);padding:5px 10px;border-radius:999px}
.cov svg{width:14px;height:14px}
.hocard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px}
.hocard>svg{width:24px;height:24px;color:var(--brand)}
.tl{display:flex;gap:12px;padding:8px 2px;line-height:1.4}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.tl-dot.health{background:var(--warn)}.tl-dot.jobs{background:var(--good)}.tl-dot.checkin{background:var(--accent)}
.tl-img{width:120px;border-radius:10px;margin-top:6px}
.promise{font-family:var(--display);font-size:1.2rem;font-weight:700;line-height:1.3;color:var(--brand);margin:4px 2px 10px}

.otp{position:relative;max-width:360px;width:100%;margin:0 auto}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;z-index:2;caret-color:transparent}
.otpbox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otpbox span{height:62px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;display:grid;place-items:center;font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;transition:border-color .15s}
.otp input:focus + .otpbox span.on,.otp input:focus + .otpbox span:first-child:empty{border-color:var(--brand)}

function todayIso(){ return iso(today0()); }

function daysFromToday(s){ return Math.round((parseIso(s) - today0())/DAY); }
function niceDate(s, opts={}){
  if (!s) return '';
  const d = parseIso(s), n = daysFromToday(s);
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  if (n > 1 && n < 7) return WD[d.getDay()];
  return (opts.short ? WDs[d.getDay()] + ' ' : WDs[d.getDay()] + ' ') + d.getDate() + ' ' + MOs[d.getMonth()];
}
function longDate(d=new Date()){ return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function timeAgo(ts){ const m = Math.round((Date.now() - ts)/60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m/60); if (h < 24) return h + 'h ago'; const d = Math.round(h/24); return d === 1 ? 'yesterday' : d + ' days ago'; }
const money = p => '£' + (Math.round(p)/100).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
function initials(n){ return String(n||'?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '?'; }
const PALETTE = ['#F4A261','#8FB3A8','#E9C46A','#B9A4D6','#9CC5E8','#F2B5B5','#B5D99C','#E8B98F'];
function colorFor(i){ return PALETTE[i % PALETTE.length]; }
function firstName(n){ return String(n||'').trim().split(/\s+/)[0] || n; }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return LS._mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ LS._mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete LS._mem[k]; } },
  _mem:{}
};
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder(), dec = new TextDecoder();
const ITER = 310000;

async function deriveKey(secret, salt, iter = ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['wrapKey','unwrapKey']);
}
async function wrapWith(kek, dataKey){ const iv = crypto.getRandomValues(new Uint8Array(12)); const w = await crypto.subtle.wrapKey('raw', dataKey, kek, {name:'AES-GCM', iv}); return {iv:b64(iv), w:b64(w)}; }
async function unwrapWith(kek, box){ return crypto.subtle.unwrapKey('raw', unb64(box.w), kek, {name:'AES-GCM', iv:unb64(box.iv)}, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function sealJSON(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj))); return JSON.stringify({iv:b64(iv), ct:b64(ct)}); }
async function openJSON(key, str){ const o = JSON.parse(str); const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct)); return JSON.parse(dec.decode(pt)); }

const Accounts = {
  list(){ try { return JSON.parse(LS.get('tendu.accounts') || '[]'); } catch(e){ return []; } },
  save(list){ LS.set('tendu.accounts', JSON.stringify(list)); },
  find(email){ email = String(email || '').trim().toLowerCase(); return this.list().find(a => a.email === email && !a.archived) || null; },
  async setPin(acctId, pin, dataKey){
    const salt = crypto.getRandomValues(new Uint8Array(16)); const kek = await deriveKey(pin + ':' + acctId, salt);
    this.patch(acctId, {pin:{salt:b64(salt), box:await wrapWith(kek, dataKey)}, pinTries:0});
  },
  clearPin(acctId){ this.patch(acctId, {pin:null, pinTries:0}); },
  viaEmail(a){ return !!(a && (a.kind === 'email' || a.pw)); },
  async unlockPin(acctId, pin){
    const a = this.list().find(x => x.id === acctId); if (!a || !a.pin) throw new Error('No PIN set.');
    const tooMany = 'Too many tries. We’ll email you a code instead.';
    if (a.lockUntil && a.lockUntil > Date.now()) throw new Error(`Too many tries. Try again in ${Math.ceil((a.lockUntil - Date.now()) / 60e3)} min.`);
    if ((a.pinTries || 0) >= 5){ if (this.viaEmail(a)) throw new Error(tooMany); this.patch(a.id, {pinTries:3}); a.pinTries = 3; }
    let key; try { key = await unwrapWith(await deriveKey(pin + ':' + acctId, unb64(a.pin.salt)), a.pin.box); }
    catch(e){ const n = (a.pinTries || 0) + 1; this.patch(acctId, {pinTries:n});
      if (n >= 5){ if (this.viaEmail(a)) throw new Error(tooMany); const L = (a.pinLocks || 0) + 1, m = Math.min(60, 2 ** L); this.patch(acctId, {pinLocks:L, lockUntil:Date.now() + m * 60e3}); throw new Error(`Too many tries. Try again in ${m} min.`); }
      const left = 5 - n; throw new Error(`Wrong PIN. ${left} ${left === 1 ? 'try' : 'tries'} left.`); }
    this.patch(acctId, {pinTries:0, lastIn:Date.now()}); return {acct:a, dataKey:key};
  },
  patch(id, p){ const l = this.list(); const i = l.findIndex(a => a.id === id); if (i >= 0){ l[i] = {...l[i], ...p}; this.save(l); } },
  remove(id){ this.save(this.list().filter(a => a.id !== id)); LS.del('tendu.data.' + id); }
};

const Session = {
  acct:null, key:null, data:null,
  async open(acct, key){
    this.acct = acct; this.key = key;
    const raw = LS.get('tendu.data.' + acct.id);
    this.data = raw ? await openJSON(key, raw) : newAccountData(acct);
    migrate(this.data);
    LS.set('tendu.last', acct.id);
  },
  _saving:null,
  save(){ // debounced, encrypted write
    clearTimeout(this._saving); this._dirty = true;
    this._saving = setTimeout(() => this._write(), 250);
  },
  _write(){ const a = this.acct, k = this.key, d = this.data; this._dirty = false; if (!a || !k || !d) return Promise.resolve();
    return sealJSON(k, d).then(s => LS.set('tendu.data.' + a.id, s)); },
  async flush(){ clearTimeout(this._saving); await this._write(); },
  lock(){ clearTimeout(this._saving); if (this._dirty) this._write(); this.acct = null; this.key = null; this.data = null; }
};

function newAccountData(acct){
  return { v:2, me:{id:uid(), name:acct.name, email:acct.email}, prefs:{theme:'system', text:'normal', autolock:true}, circles:[], active:null, plan:'free', createdAt:Date.now() };
}
function migrate(d){ d.prefs = d.prefs || {theme:'system', text:'normal', autolock:true}; d.circles = d.circles || []; }

async function exportBackup(){
  await Session.flush();
  const a = Accounts.list().find(x => x.id === Session.acct.id);
  return JSON.stringify({tendu:'backup', v:2, account:{...a, pin:null, pinTries:0, bio:null, lockUntil:0, pinLocks:0}, data:LS.get('tendu.data.' + a.id)});
}

const D = () => Session.data;
function circle(){ const d = D(); return d.circles.find(c => c.id === d.active) || d.circles[0] || null; }
function me(c = circle()){ return c ? c.members.find(m => m.isMe) : null; }
function member(id, c = circle()){ return c && c.members.find(m => m.id === id); }
function memberName(id, c){ const m = member(id, c); return m ? (m.isMe ? 'You' : firstName(m.name)) : 'Someone'; }
function save(){ Session.save(); }
function log(c, text, kind='update', by){ c.feed.unshift({id:uid(), by: by || me(c).id, text, kind, at:Date.now()}); if (c.feed.length > 400) c.feed.length = 400; }

function newCircle({name, preferred, age, relation, lives, photo}){

  const c = {

    members:[{id:uid(), name:d.me.name, relation:'Me', phone:'', color:PALETTE[0], isMe:true, role:'organiser'}],
    items:[], meds:[], waiting:[], feed:[], visits:[], costs:[], checkins:{}, obs:[], questions:[], docs:[],
    about:{likes:'', calms:'', upsets:'', routine:'', life:'', communication:''},

function addMember(c, {name, relation, phone, role}){
  const m = {id:uid(), name:name.trim(), relation:relation||'', phone:phone||'', color:PALETTE[c.members.length % PALETTE.length], isMe:false, role:role||'family'};
  c.members.push(m); save(); return m;
}
const PRON = {she:{sub:'she',obj:'her',pos:'her'}, he:{sub:'he',obj:'him',pos:'his'}, they:{sub:'they',obj:'them',pos:'their'}};
function P(c){ return PRON[c && c.pronoun] || PRON.they; }
function whoName(c){ return c.preferred || firstName(c.name); }
function relLabel(c){ return c.relation ? c.relation.toLowerCase() : whoName(c); }

function addItem(c, it){
  const x = {id:uid(), kind:it.kind||'task', title:it.title.trim(), detail:it.detail||'', date:it.date||'', time:it.time||'', owner:it.owner||'', repeat:it.repeat||'none', done:false, createdAt:Date.now(), by:me(c).id};
  c.items.push(x); save(); return x;
}
function completeItem(c, it, on = true){
  it.done = on; it.doneBy = on ? me(c).id : null; it.doneAt = on ? Date.now() : null;
  if (on){
    log(c, `${it.kind === 'appointment' ? 'Went to' : 'Done'}: ${it.title}`, 'done');
    if (it.repeat && it.repeat !== 'none' && !it._spawned){
      const step = {weekly:7, fortnightly:14, '4weekly':28, monthly:30}[it.repeat] || 0;
      if (step){ const base = it.date || todayIso(); addItem(c, {...it, date:plusDays(step, base), done:false}); it._spawned = true; }
    }
  }
  save();
}
function openItems(c){ return c.items.filter(i => !i.done).sort(byWhen); }
function byWhen(a, b){ return ((a.date||'9999') + (a.time||'99')).localeCompare((b.date||'9999') + (b.time||'99')); }
function unclaimed(c){ return openItems(c).filter(i => !i.owner); }
function overdueWaiting(c){ return c.waiting.filter(w => !w.done && daysFromToday(w.due) < 0); }
function lowMeds(c){ return c.meds.filter(m => m.supplyUntil && daysFromToday(m.supplyUntil) <= 7); }
function checkedInToday(c){ return c.checkins[todayIso()]; }

function visitsOn(c, dayIso){ return c.visits.filter(v => v.date === dayIso); }
function weekGaps(c, days = 7){ const g = []; for (let i = 0; i < days; i++){ const d = plusDays(i); if (!visitsOn(c, d).length) g.push(d); } return g; }

function balances(c){
  const fam = c.members.filter(m => m.role !== 'carer');
  const shared = c.costs.filter(x => x.shared !== false);
  const total = shared.reduce((s,x) => s + x.amount, 0);
  const each = fam.length ? total / fam.length : 0;
  const paid = Object.fromEntries(fam.map(m => [m.id, 0]));
  shared.forEach(x => { if (x.paidBy in paid) paid[x.paidBy] += x.amount; });
  const bal = fam.map(m => ({m, paid:paid[m.id], net:paid[m.id] - each}));
  const debt = bal.filter(b => b.net < -0.5).map(b => ({...b, left:-b.net})), cred = bal.filter(b => b.net > 0.5).map(b => ({...b, left:b.net}));
  const moves = [];
  for (const d of debt){ for (const cr of cred){ if (d.left < 0.5) break; if (cr.left < 0.5) continue; const amt = Math.min(d.left, cr.left); moves.push({from:d.m, to:cr.m, amount:amt}); d.left -= amt; cr.left -= amt; } }
  return {total, each, bal, moves};
}

function loadThisMonth(c){
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  const counts = Object.fromEntries(c.members.map(m => [m.id, 0]));
  c.items.forEach(i => { if (i.done && i.doneAt >= start && i.doneBy in counts) counts[i.doneBy]++; });
  c.visits.forEach(v => { if (parseIso(v.date) >= start && parseIso(v.date) <= today0() && v.memberId in counts) counts[v.memberId]++; });
  c.feed.forEach(f => { if (f.at >= start && f.kind === 'update' && f.by in counts) counts[f.by] += 0.5; });
  Object.values(c.checkins).forEach(ci => { if (ci.at >= start && ci.by in counts) counts[ci.by] += 0.5; });
  return c.members.map(m => ({m, n:Math.round(counts[m.id])})).sort((a,b) => b.n - a.n);
}

const OBS = [
  {k:'slept', t:'Slept well', ok:1}, {k:'poorsleep', t:'Poor sleep'}, {k:'eating', t:'Eating well', ok:1}, {k:'noteating', t:'Not eating much'},
  {k:'cheerful', t:'Cheerful', ok:1}, {k:'low', t:'Low mood'}, {k:'confused', t:'More confused'}, {k:'agitated', t:'Agitated'},
  {k:'walking', t:'Walking well', ok:1}, {k:'unsteady', t:'Unsteady'}, {k:'fall', t:'Had a fall'}, {k:'pain', t:'In pain'},
  {k:'social', t:'Enjoyed company', ok:1}, {k:'lonely', t:'Seemed lonely'}, {k:'goodday', t:'Good day overall', ok:1}, {k:'unsettled', t:'Unsettled'}
];
const obsTag = k => OBS.find(o => o.k === k) || {t:k};
function obsStrip(c, days = 14){
  const out = [];
  for (let i = days - 1; i >= 0; i--){
    const d = plusDays(-i); const rows = c.obs.filter(o => o.date === d);
    const concern = rows.reduce((s,o) => s + o.tags.filter(t => !obsTag(t).ok).length, 0);
    const good = rows.reduce((s,o) => s + o.tags.filter(t => obsTag(t).ok).length, 0);
    out.push({d, n:rows.length, concern, good});
  }
  return out;
}
function obsCounts(c, days = 14){
  const since = plusDays(-(days-1)); const m = {};
  c.obs.filter(o => o.date >= since).forEach(o => o.tags.forEach(t => m[t] = (m[t]||0) + 1));
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}

function nudges(c){
  const n = [], who = whoName(c);
  if (!checkedInToday(c)) n.push({icon:'heart', tone:'accent', t:`No check-in for ${who} yet today`, s:`Tap “All OK today” once someone has seen or spoken to ${P(c).obj}.`, go:'checkin'});
  const un = unclaimed(c); if (un.length) n.push({icon:'handshake', tone:'warn', t:`${un.length} ${un.length===1?'job needs':'jobs need'} someone`, s:un.slice(0,2).map(i => i.title).join(' · '), go:'home'});
  const ow = overdueWaiting(c); if (ow.length) n.push({icon:'hourglass', tone:'warn', t:`${ow.length} late ${ow.length===1?'reply':'replies'} to chase`, s:ow[0].title + ' · ' + ow[0].from, go:'waiting'});
  const gaps = weekGaps(c).filter(d => daysFromToday(d) >= 0 && daysFromToday(d) <= 4);
  if (c.visits.length && gaps.length) n.push({icon:'calendar', tone:'brand', t:`Nobody's down to see ${who} on ${niceDate(gaps[0]).toLowerCase()}`, s:'Open the rota to pick a day.', go:'plan'});
  const lm = lowMeds(c); if (lm.length) n.push({icon:'pill', tone:'brand', t:`${lm[0].name} runs out ${niceDate(lm[0].supplyUntil).toLowerCase()}`, s:'Order the repeat prescription in time.', go:'meds'});
  const bal = balances(c); const mine = bal.moves.find(m => m.from.isMe); if (mine) n.push({icon:'pound', tone:'plain', t:`You owe ${firstName(mine.to.name)} ${money(mine.amount)}`, s:'From shared care costs this month.', go:'costs'});
  return n;
}

function handoverBrief(c, forId, sinceDays = 3){
  const who = whoName(c), since = Date.now() - sinceDays*DAY, sinceIso = plusDays(-sinceDays);
  const f = member(forId, c); const name = f ? firstName(f.name) : 'there';
  const L = [];
  L.push(`Hi ${f && f.isMe ? 'there' : name}, here's how things are with ${who}.`);
  const ups = c.feed.filter(x => x.at >= since && x.kind === 'update').slice(0,4);
  const ob = c.obs.filter(o => o.date >= sinceIso);
  L.push(`\n## How ${P(c).sub} ${P(c).sub==='they'?'are':'is'}`);
  if (ups.length) ups.forEach(u => L.push(`• ${u.text} (${memberName(u.by, c)}, ${timeAgo(u.at)})`));
  if (ob.length){ const tags = [...new Set(ob.flatMap(o => o.tags))].map(t => obsTag(t).t.toLowerCase()); L.push(`• Noted lately: ${tags.join(', ')}.`); }
  if (!ups.length && !ob.length) L.push('• No updates recorded in the last few days.');
  const changes = c.meds.filter(m => m.changedAt && m.changedAt >= since);
  const newItems = c.items.filter(i => i.createdAt >= since && !i.done);
  if (changes.length || newItems.length){ L.push('\n## What’s changed'); changes.forEach(m => L.push(`• Medicine: ${m.name}${m.when ? ', ' + m.when.charAt(0).toLowerCase() + m.when.slice(1) : ''}${m.prev ? ' (was ' + m.prev + ')' : ''}`)); newItems.slice(0,4).forEach(i => L.push(`• New: ${i.title}`)); }
  const soon = openItems(c).filter(i => i.date && daysFromToday(i.date) <= 7 && daysFromToday(i.date) >= 0).slice(0,5);
  L.push('\n## Coming up'); if (soon.length) soon.forEach(i => L.push(`• ${niceDate(i.date)}${i.time ? ' ' + i.time : ''}: ${i.title}${i.owner ? ' (' + memberName(i.owner, c) + ')' : ' (needs someone)'}`)); else L.push('• Nothing booked for the next week.');
  const yours = openItems(c).filter(i => i.owner === forId).slice(0,5), un = unclaimed(c).slice(0,3);
  L.push(`\n## ${f && f.isMe ? 'Yours' : name + '’s jobs'}`); if (yours.length) yours.forEach(i => L.push(`• ${i.title}${i.date ? ' · ' + niceDate(i.date) : ''}`)); else L.push('• Nothing assigned yet.'); if (un.length) L.push(`• Could take: ${un.map(i => i.title).join(', ')}`);
  const ow = overdueWaiting(c); if (ow.length){ L.push('\n## Still waiting on'); ow.forEach(w => L.push(`• ${w.title} from ${w.from} (${-daysFromToday(w.due)} days late)`)); }
  const lm = lowMeds(c); if (lm.length){ L.push('\n## Running low'); lm.forEach(m => L.push(`• ${m.name}: supply ends ${niceDate(m.supplyUntil)}`)); }
  return L.join('\n');
}
function chaserText(c, w){
  const late = -daysFromToday(w.due), sender = me(c).name;
  return `Dear ${w.from},\n\nI'm writing on behalf of ${c.name}${c.relation ? ', my ' + c.relation.toLowerCase() : ''}, about the ${w.title.charAt(0).toLowerCase() + w.title.slice(1)}. We first asked on ${niceDate(w.asked)} and were told to expect it by ${niceDate(w.due)}.${late > 0 ? ` It is now ${late} day${late===1?'':'s'} past that date.` : ''}\n\nCould you let me know where things stand, and when we can expect it?${w.ref ? '\n\nReference: ' + w.ref : ''}\n\nThank you for your help.\n\nKind regards,\n${sender}`;
}
function weeklyUpdate(c){
  const who = whoName(c), since = Date.now() - 7*DAY;
  const done = c.items.filter(i => i.done && i.doneAt >= since).map(i => i.title.toLowerCase());
  const up = openItems(c).filter(i => i.kind === 'appointment' && i.date && daysFromToday(i.date) <= 14).slice(0,3);
  const happy = c.feed.find(f => f.kind === 'update' && f.at >= since);
  const un = unclaimed(c).slice(0,2);
  return `Hello everyone, here's ${who}'s week.\n\n${happy ? happy.text + '\n\n' : ''}${done.length ? 'Done this week: ' + done.slice(0,5).join(', ') + '.\n\n' : ''}Coming up: ${up.length ? up.map(i => i.title + ' (' + niceDate(i.date) + ')').join(', ') : 'nothing booked yet'}.\n\n${un.length ? 'If you can help: ' + un.map(i => i.title.toLowerCase()).join(' and ') + '.' : `A phone call always makes ${P(c).pos} day.`}\n\nLove, ${firstName(me(c).name)}`;
}
function prepNotes(c, appt){
  const who = whoName(c), counts = obsCounts(c, 30);
  const L = [`NOTES FOR: ${appt ? appt.title + ' · ' + niceDate(appt.date) + (appt.time ? ' ' + appt.time : '') : 'next appointment'}`, `About: ${c.name}${c.age ? ', ' + c.age : ''}`];
  L.push('\n## What the family has noticed (last 30 days)');
  if (counts.length) counts.slice(0,6).forEach(([k,n]) => L.push(`• ${obsTag(k).t}: noted ${n} time${n===1?'':'s'}`)); else L.push('• No observations recorded.');
  const falls = c.obs.filter(o => o.tags.includes('fall')); if (falls.length) L.push(`• Falls recorded on: ${falls.map(o => niceDate(o.date)).join(', ')}`);
  c.feed.filter(f => f.kind === 'update' && f.at >= Date.now() - 14*DAY).slice(0,3).forEach(f => L.push(`• “${f.text}” (${memberName(f.by, c)})`));
  L.push('\n## Medicines as we have them'); if (c.meds.length) c.meds.forEach(m => L.push(`• ${m.name}${m.when ? ', ' + m.when.toLowerCase() : ''}${m.changedAt && m.changedAt > Date.now() - 30*DAY ? ' (changed recently)' : ''}`)); else L.push('• None recorded.');
  const qs = c.questions.filter(q => !q.done); L.push('\n## Our questions'); if (qs.length) qs.forEach(q => L.push(`• ${q.text}`)); else L.push('• Add questions any time from the Questions list.');
  L.push('\n## Bring'); L.push('• Medicines or the repeat slip, glasses, hearing aid, this note');
  L.push(`\nThese are the family's own notes. The clinician decides what they mean.`);
  return L.join('\n');
}

function smartFile(c, text){
  const t = ' ' + text.toLowerCase() + ' ';
  const meId = me(c).id;
  let kind = 'update';
  const money = text.match(/£\s?(\d+(?:\.\d{1,2})?)/);
  if (money && /(paid|spent|cost|bought|£)/.test(t)) kind = 'expense';
  else if (/\b(\d+\s?(mg|mcg|ml)|tablet|tablets|medicine|medication|prescri|dose|inhaler|patch|capsule)\b/.test(t) && /(start|going up|increase|reduce|stop|change|new|switch|now)/.test(t)) kind = 'medication';
  else if (/(waiting|haven't heard|have not heard|still no|no reply|not heard|chase|referral|referred)/.test(t)) kind = 'waiting';

function cleanTitle(text, kind){

async function busy(btnSel, fn){ const b = document.querySelector(btnSel); const t = b && b.innerHTML; if (b){ b.disabled = true; b.innerHTML = 'Please wait…'; } try { await fn(); } finally { if (b && document.contains(b)){ b.disabled = false; b.innerHTML = t; } } }
ACTIONS.pin = async (v) => {
  if (v === 'del'){ App.pinEntry = (App.pinEntry||'').slice(0,-1); return render(); }
  App.pinEntry = ((App.pinEntry||'') + v).slice(0,4); App.authMsg = ''; render();
  if (App.pinEntry.length !== 4) return;
  const id = App.lockedAcct || LS.get('tendu.last');
  try { const {acct, dataKey} = await Accounts.unlockPin(id, App.pinEntry); await Session.open(acct, dataKey); App.pinEntry = ''; App.lockedAcct = null; render(); }
  catch(e){ App.pinEntry = '';
    if (/email you a code/.test(e.message)){ const a = Accounts.list().find(x => x.id === id); App.em = {flow:'forgot', email:a ? a.email : ''}; App.authView = 'email'; App.authMsg = 'Too many wrong PINs. We’ll email you a code to get back in.'; }
    else App.authMsg = e.message;
    render(); }
};

let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden){ hiddenAt = Date.now(); if (Session.data) await Session.flush(); return; }
  if (Session.data && Session.data.prefs.autolock && hiddenAt && Date.now() - hiddenAt > 5*60e3) lockNow();
});
function lockNow(){ const a = Accounts.list().find(x => x.id === Session.acct.id); App.lockedAcct = a.id; Session.lock(); App.sheet = null; App.pipOpen = false;
  App.em = {flow:'signin', email:a.email}; App.authView = a.pin ? 'pin' : 'email'; App.authMsg = ''; render(); }

function itemRow(c, i, opts = {}){
  const o = i.owner ? member(i.owner, c) : null;
  const when = i.time ? `${esc(i.time)}${opts.showDate && i.date ? `<small>${esc(daysFromToday(i.date) === 0 ? 'Today' : daysFromToday(i.date) === 1 ? 'Tmrw' : WDs[parseIso(i.date).getDay()] + ' ' + parseIso(i.date).getDate())}</small>` : ''}` : (opts.showDate && i.date ? `${parseIso(i.date).getDate()}<small>${MOs[parseIso(i.date).getMonth()]}</small>` : ic(i.kind === 'appointment' ? 'calendar' : 'task'));
  const kindLabel = i.kind === 'appointment' ? 'Appointment' : (i.repeat && i.repeat !== 'none' ? 'Repeats ' + ({weekly:'weekly', fortnightly:'fortnightly', '4weekly':'every 4 weeks', monthly:'monthly'}[i.repeat]) : '');
  const sub = [kindLabel, i.detail].filter(Boolean).join(' · ');
  const end = i.done ? '' : (o ? avatar(o) : `<button class="claim" data-a="claim" data-id="${i.id}">Take it</button>`);
  return `<div class="ti${i.done ? ' done' : ''}"><button class="when" data-a="sheet" data-v="item" data-id="${i.id}" aria-label="Open ${esc(i.title)}">${when}</button>
    <button class="body" style="text-align:left" data-a="sheet" data-v="item" data-id="${i.id}"><div class="ttl">${esc(i.title)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</button>
    <span class="end">${end}<button class="chk" role="checkbox" aria-checked="${i.done}" aria-label="Mark done: ${esc(i.title)}" data-a="toggleItem" data-id="${i.id}">${ic('check')}</button></span></div>`;
}
function groupedTimeline(c){
  const open = openItems(c);
  const doneToday = c.items.filter(i => i.done && i.doneAt && Date.now() - i.doneAt < 12*3600e3);
  const g = {overdue:[], today:[], tomorrow:[], week:[], later:[], anytime:[]};
  open.forEach(i => { if (!i.date) return g.anytime.push(i); const n = daysFromToday(i.date); if (n < 0) g.overdue.push(i); else if (n === 0) g.today.push(i); else if (n === 1) g.tomorrow.push(i); else if (n < 7) g.week.push(i); else g.later.push(i); });
  g.today.push(...doneToday);
  const block = (title, list, opts) => list.length ? `<div class="section"><div class="sechead"><h2>${title}</h2>${opts && opts.badge ? opts.badge : ''}</div><div class="list">${list.map(i => itemRow(c, i, opts)).join('')}</div></div>` : '';
  const html = block('Overdue', g.overdue, {showDate:true, badge:`<span class="badge warn">${g.overdue.length}</span>`}) + block('Today', g.today) + block('Tomorrow', g.tomorrow) + block('This week', g.week, {showDate:true}) + block('Later', g.later, {showDate:true}) + block('Any time', g.anytime);
  return html || `<div class="section card">${empty('calendar', 'Nothing planned yet', 'Add appointments, jobs or anything on your mind. Tap + and type it like a text.', `<button class="btn sm mt8" data-a="sheet" data-v="capture">${ic('plus')}Add something</button>`)}</div>`;
}

    </section>
    <div class="stats mt12">
      <button class="stat" data-a="go" data-v="plan"><div class="n">${open}</div><div class="l">Open jobs</div></button>
      <button class="stat ${un ? 'warn' : 'good'}" data-a="scrollTo" data-v="timeline"><div class="n">${un}</div><div class="l">Need someone</div></button>

  const mine = openItems(c).filter(i => i.owner === me(c).id && (!i.date || i.date <= end));

  return `${bar('I need a break')}

    ${mine.length ? (others.length ? `<button class="btn mt16" data-a="brkGo">${ic('handshake')}Share my jobs out</button>` : `<p class="small muted mt16">Add family or friends in People first, so there’s someone to pass jobs to.</p>`) : ''}
    <div class="card accent mt16"><b>Look after yourself too</b><div class="small mt8">You can ask your council for a carer’s assessment, and the Carers UK Helpline is free on <b style="white-space:nowrap">0808 808 7777</b>.</div></div>`;
};
ACTIONS.brkDays = v => { App.brkDays = +v; render(); };
ACTIONS.brkGo = () => {
  const c = circle(), end = plusDays(App.brkDays || 3), meId = me(c).id;
  const ranking = loadThisMonth(c).filter(x => !x.m.isMe && x.m.role !== 'carer').sort((a,b) => a.n - b.n).map(x => x.m);
  const mine = openItems(c).filter(i => i.owner === meId && (!i.date || i.date <= end)); const moved = [];
  mine.forEach((i, k) => { const to = ranking[k % ranking.length]; i.owner = to.id; moved.push(`${i.title} → ${firstName(to.name)}`); });
  log(c, `${firstName(me(c).name)} is taking a short break until ${niceDate(end).toLowerCase()}. Passed on: ${moved.join('; ')}. Thank you all.`, 'update');
  save(); go('home'); toast('Your jobs are covered. Rest well.');
};

  const love = c.feed.find(f => f.kind === 'update' && f.by !== 'person' && !/^(Checked in|Medicine|Paid|Added|Family meeting)/.test(f.text));

};

  const hits = [];

    c.items.forEach(i => { if ((i.title + ' ' + i.detail).toLowerCase().includes(q)) hits.push(li({icon:i.kind === 'appointment' ? 'calendar' : 'task', title:esc(i.title), sub:esc([i.done ? 'Done' : 'Open', niceDate(i.date)].filter(Boolean).join(' · ')), a:'sheet', v:'item', id:i.id})); });
    c.meds.forEach(m => { if ((m.name + ' ' + m.when + ' ' + m.notes).toLowerCase().includes(q)) hits.push(li({icon:'pill', title:esc(m.name), sub:esc(m.when), a:'sheet', v:'med', id:m.id})); });
    c.waiting.forEach(w => { if ((w.title + ' ' + w.from).toLowerCase().includes(q)) hits.push(li({icon:'hourglass', tone:'c-warn', title:esc(w.title), sub:esc(w.from), a:'go', v:'waiting'})); });
    c.docs.forEach(d => { if ((d.title + ' ' + d.kind).toLowerCase().includes(q)) hits.push(li({icon:'doc', tone:'c-plain', title:esc(d.title), sub:esc(d.kind), a:'sheet', v:'docView', id:d.id})); });

const Reminders = {
  plugin(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications; },
  available(){ return !!this.plugin(); },
  async enable(){ const p = this.plugin(); if (!p) return false; const r = await p.requestPermissions(); return r && r.display === 'granted'; },
  async sync(){
    const p = this.plugin(); const d = Session.data; if (!p || !d || !d.prefs.reminders) return;
    try {
      const pending = await p.getPending(); if (pending.notifications.length) await p.cancel({notifications:pending.notifications.map(n => ({id:n.id}))});
      const list = []; let id = 1; const now = Date.now();
      const at = (dateIso, hhmm) => { const [h, m] = (hhmm || '09:00').split(':').map(Number); const x = parseIso(dateIso); x.setHours(h, m, 0, 0); return x; };
      for (const c of d.circles){
        const who = whoName(c);
        openItems(c).filter(i => i.kind === 'appointment' && i.date).forEach(i => {
          const evening = at(plusDays(-1, i.date), '18:00'); if (evening > now && list.length < 60) list.push({id:id++, title:`Tomorrow: ${i.title}`, body:`${who}${i.time ? ' at ' + i.time : ''}${i.owner ? ' · ' + memberName(i.owner, c) + ' is going' : ' · nobody is down to go yet'}`, schedule:{at:evening, allowWhileIdle:true}});
          if (i.time){ const hour = new Date(at(i.date, i.time).getTime() - 3600e3); if (hour > now && list.length < 60) list.push({id:id++, title:`In an hour: ${i.title}`, body:who, schedule:{at:hour, allowWhileIdle:true}}); }
        });
        openItems(c).filter(i => i.kind === 'task' && i.date && i.owner === me(c).id).forEach(i => { const t = at(i.date, '09:00'); if (t > now && list.length < 60) list.push({id:id++, title:i.title, body:`For ${who} today`, schedule:{at:t}}); });
        c.meds.filter(m => m.supplyUntil).forEach(m => { const t = at(plusDays(-7, m.supplyUntil), '10:00'); if (t > now && list.length < 60) list.push({id:id++, title:`Order ${m.name}`, body:`${who}’s supply runs out in a week`, schedule:{at:t}}); });
        if (d.prefs.dailyNudge){ for (let k = 0; k < 7; k++){ const day = plusDays(k); if (c.checkins[day]) continue; const t = at(day, '11:00'); if (t > now) list.push({id:id++, title:`Has anyone checked on ${who} today?`, body:'Open Tendu and tap “All OK today”.', schedule:{at:t}}); } }
      }
      if (list.length) await p.schedule({notifications:list});
    } catch(e){}
  }
};
const _save = Session.save.bind(Session);
Session.save = function(){ _save(); clearTimeout(Reminders._t); Reminders._t = setTimeout(() => Reminders.sync(), 1500); };
ACTIONS.toggleReminders = async () => {
  const d = D();
  if (!d.prefs.reminders){ if (!Reminders.available()) return toast('Reminders work in the Tendu phone app', 'info'); const ok = await Reminders.enable(); if (!ok) return toast('Allow notifications for Tendu in your phone’s settings', 'info'); d.prefs.reminders = true; d.prefs.dailyNudge = d.prefs.dailyNudge !== false; }
  else { d.prefs.reminders = false; const p = Reminders.plugin(); if (p){ const pend = await p.getPending(); if (pend.notifications.length) await p.cancel({notifications:pend.notifications.map(n => ({id:n.id}))}); } }
  save(); render(); toast(d.prefs.reminders ? 'Reminders on' : 'Reminders off');
};
ACTIONS.toggleNudge = () => { D().prefs.dailyNudge = !D().prefs.dailyNudge; save(); render(); };

function setupSteps(c){
  return [
    {k:'secure', t:'Confirm your email for sign-in', done: (a => !!a.em || a.kind === 'local')(Accounts.list().find(x => x.id === Session.acct.id) || {}), a:'go', v:'security'},
    {k:'plan', t:'Add the next appointment or job', done: c.items.length > 0, a:'sheet', v:'capture'},
    {k:'people', t:'Add the people who help', done: c.members.length > 1, a:'sheet', v:'member'},
    {k:'meds', t:'Add medicines (if any)', done: c.meds.length > 0 || c.setupSkip?.meds, a:'go', v:'meds'},
    {k:'sos', t:'Fill in the emergency card', done: !!(c.emergency.allergies || c.emergency.gp || c.emergency.conditions), a:'sheet', v:'editEmergency'},
    {k:'about', t:`Write “This is ${whoName(c)}”`, done: Object.values(c.about).some(Boolean), a:'sheet', v:'editAbout'},
    {k:'rota', t:'Put a visit or call on the rota', done: c.visits.length > 0, a:'go', v:'plan'}
  ];
}
function setupCard(c){
  if (c.setupHidden) return '';
  const s = setupSteps(c), n = s.filter(x => x.done).length; if (n === s.length) return '';
  return `<div class="section"><div class="sechead"><h2>Getting started</h2><button class="more" data-a="hideSetup">Hide</button></div>
    <div class="card" style="padding:6px 0"><div style="padding:8px 16px 10px"><div class="row" style="justify-content:space-between"><span class="small b">${n} of ${s.length} done</span><span class="tiny muted">About 5 minutes</span></div><div class="barrow" style="grid-template-columns:1fr;margin-top:8px"><span class="track"><span class="fill" style="display:block;width:${Math.round(n/s.length*100)}%"></span></span></div></div>
    ${s.map(x => `<button class="li noicon" data-a="${x.done ? '' : x.a}" data-v="${x.v}" ${x.done ? 'disabled' : ''} style="min-height:50px"><span class="chk" aria-checked="${x.done}" style="width:24px;height:24px">${ic('check')}</span><span class="main"><div class="ttl" style="font-weight:${x.done ? 450 : 600};${x.done ? 'color:var(--sub);text-decoration:line-through' : ''}">${esc(x.t)}</div></span>${x.done ? '' : chevron()}</button>`).join('')}</div></div>`;
}

function careSummary(c){
  const a = c.about, h = c.house || {}, e = c.emergency;
  const sec = (t, lines) => lines.filter(Boolean).length ? `\n## ${t}\n` + lines.filter(Boolean).join('\n') : '';
  return `CARE SUMMARY: ${c.name}${c.preferred ? ' (' + c.preferred + ')' : ''}${c.age ? ', ' + c.age : ''}\nPrepared by ${me(c).name}, ${longDate()}`
    + sec('About them', [a.life && '• ' + a.life, a.likes && '• Loves: ' + a.likes, a.calms && '• What calms them: ' + a.calms, a.upsets && '• What upsets them: ' + a.upsets, a.communication && '• Talking with them: ' + a.communication])
    + sec('Daily routine', [a.routine && '• ' + a.routine])
    + sec('Health (as told to the family)', [e.conditions && '• Conditions: ' + e.conditions, '• Allergies: ' + (e.allergies || 'none recorded'), e.mobility && '• Mobility: ' + e.mobility])
    + sec('Medicines (as recorded)', c.meds.map(m => '• ' + m.name + (m.when ? ', ' + m.when : '')))
    + sec('Coming up', openItems(c).filter(i => i.date && daysFromToday(i.date) >= 0 && daysFromToday(i.date) <= 7).map(i => `• ${niceDate(i.date)}${i.time ? ' ' + i.time : ''}: ${i.title}`))
    + sec('Who to call', c.members.filter(m => m.phone).map(m => `• ${m.name}${m.relation ? ' (' + m.relation + ')' : ''}: ${m.phone}`).concat([e.gp && `• GP: ${e.gp}${e.gpPhone ? ', ' + e.gpPhone : ''}`]))
    + sec('The house', HOUSE.filter(([k]) => k !== 'keysafe' && h[k]).map(([k,l]) => `• ${l}: ${h[k]}`))
    + `\n\nIn an emergency call 999. Key safe code is shared separately.`;
}

  <div class="card"><div class="brief">${briefHtml(App._sum)}</div></div><div class="btnrow mt12"><button class="btn" data-a="shareSum">${ic('share')}Send</button><button class="btn ghost" data-a="copySum">${ic('copy')}Copy</button></div>

PAGES.me = c => {
  const last = (D().wellbeing || []).slice(-1)[0];
  const score = last ? Object.values(last.a).reduce((s,v) => s + v, 0) : null;
  const ans = App.wb || {};
  return `${bar('How are you doing?')}<h1 class="largetitle">How are you doing?</h1><p class="subtitle">Looking after someone is hard work. Three quick questions, just for you. Nobody else sees the answers.</p>
    <div class="stack">${WB.map(([k,q,opts]) => `<div class="card"><b>${q}</b><div class="seg mt12" role="group">${opts.map((o,i) => `<button data-a="wbAns" data-v="${k}:${i}" aria-pressed="${ans[k]===i}">${o}</button>`).join('')}</div></div>`).join('')}</div>
    <button class="btn mt16" data-a="wbSave" ${Object.keys(ans).length < 3 ? 'disabled' : ''}>See suggestions</button>
    ${score !== null ? `<div class="card ${score >= 4 ? 'accent' : 'tint'} mt16"><b>${score >= 4 ? 'It sounds like you’re carrying a lot.' : score >= 2 ? 'You’re managing, but keep an eye on yourself.' : 'Good to hear you’re doing OK.'}</b>
      <ul class="small" style="margin:8px 0 0;padding-left:18px;line-height:1.6">${score >= 2 ? `<li>Hand some jobs to the circle with <b>I need a break</b>.</li><li>Ask your council for a <b>carer’s assessment</b>: it’s free and it’s for you.</li>` : ''}<li>Put one thing for yourself in the calendar this week.</li>${score >= 4 ? `<li>Talk it through with the Carers UK Helpline: <b style="white-space:nowrap">0808 808 7777</b> (Mon–Fri, 9am–6pm). If you’re struggling to cope, speak to your GP.</li>` : ''}</ul>
      <div class="btnrow mt12">${score >= 2 ? `<button class="btn sm" data-a="go" data-v="brk">I need a break</button>` : ''}<button class="btn sm ghost" data-a="go" data-v="support">Support guide</button></div></div>` : ''}`;
};
ACTIONS.wbAns = v => { const [k,i] = v.split(':'); App.wb = {...(App.wb||{}), [k]:+i}; render(); };
ACTIONS.wbSave = () => { const d = D(); (d.wellbeing = d.wellbeing || []).push({at:Date.now(), a:{...App.wb}}); App.wb = {}; save(); render(); window.scrollTo(0, document.body.scrollHeight); };

PAGES.guide = () => `${bar('How Tendu works')}<h1 class="largetitle">How Tendu works</h1><p class="subtitle">The things that make the biggest difference.</p>
  <div class="list">${[
    ['plus','Tap + and type it like a text','Appointments, medicine changes, things you’re waiting for, costs. Tendu sorts them for you.'],
    ['handshake','Take jobs, or ask for help','Tap “Take it” on any job. Use Ask for help to send a request to the family chat.'],
    ['heart','One tap: All OK today','Whoever sees or speaks to them taps it, so nobody worries or rings round.'],
    ['list','Not sure what to do? Try “What now?”','Ideas for each situation from NHS and GOV.UK guidance. Your team chooses what to add, when, and who does it.'],
    ['users','Connect: more than medicine','Record what matters, check wellbeing, and find groups, activities and support nearby.'],
    ['chat','Share the plan with the family','Set up the team chat and everyone sees the same jobs, visits and notes, encrypted end to end.'],
    ['route','Send a handover','Before someone else takes over, send the one-minute brief from the Team tab.'],
    ['siren','Keep the emergency card ready','Fill it in once. Share it with paramedics, the hospital or a new carer in seconds.']
  ].map(([i,t,s]) => li({icon:i, title:t, sub:s})).join('')}</div>
  <div class="card tint mt16 small"><b>Private by design.</b> Everything is encrypted on your phone and opened with your PIN. No ads, and no one can read your circle but you and your team.</div>`;
