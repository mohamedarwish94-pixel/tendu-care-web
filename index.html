   src:S('Carers Trust','https://carers.org/')},
  {id:'lonely', cat:'you', t:'Loneliness and isolation', sub:'Small steps to feel more connected', needs:['lonely','older','mental','physical','sight','grief','self'],
   body:[['Things that help',['Regular chats with friends and family, even short ones.','Join a group or club around something they enjoy, in person or online.','Get outside, move a little, do a hobby.','Volunteer or help someone else: it builds connection both ways.','Look for free local events through the council or library.']],
         ['As a carer you can',['Put a weekly call on the rota so nobody goes a day without a chat.','Ask about befriending services, which match people with a regular friendly caller or visitor.','If loneliness goes on for a long time or low mood sets in, talk to the GP.']]],
   src:S('NHS Every Mind Matters: loneliness','https://www.nhs.uk/every-mind-matters/lifes-challenges/loneliness/')},
  {id:'debt', cat:'money', t:'Money worries and debt', sub:'Free, impartial help', needs:['moneyw','self','grief'],
   body:[['Start here',['Write down what comes in and what goes out each month.','Deal with priority bills first: rent or mortgage, council tax, energy, and court fines. These have the most serious consequences.','Contact the people you owe early. Many have hardship schemes.']],
         ['Free help',['MoneyHelper has a free debt advice locator, a benefits calculator and a bill prioritiser.','Never pay for debt advice. Free, regulated services exist.','Check benefits: many carers and disabled people are entitled to more than they claim.']]],
   src:S('MoneyHelper: dealing with debt','https://www.moneyhelper.org.uk/en/money-troubles/dealing-with-debt')},
  {id:'grief', cat:'you', t:'Grief and bereavement', sub:'For you, and for others in the family', needs:['grief','eol'],
   body:[['What can help',['Talk about how you feel with a friend, family member, health professional or counsellor.','Peer support groups help many people.','Keep regular meals, sleep and some exercise.','Don’t try to do everything at once.','Try not to use alcohol, cigarettes, gambling or drugs to cope.']],
         ['When to get more help',['See a GP if low mood lasts more than 2 weeks or self-help isn’t working.','In England you can refer yourself to NHS talking therapies.','Cruse Bereavement Support offers free help.']]],
   src:S('NHS: grief after bereavement or loss','https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/')},
  {id:'death', cat:'money', t:'What to do when someone dies', sub:'The practical steps, in order', needs:['grief','eol'],
   body:[['The main steps',['Register the death within 5 days of the medical examiner’s confirmation (England and Wales).','Use Tell Us Once to tell most government services in one go.','Arrange the funeral. Help with costs may be available.','Check bereavement benefits such as Bereavement Support Payment.','Value the estate and apply for probate if needed.']],
         ['Also tell',['Employers and private pension providers.','Banks, utility companies and landlords.','Tip: share these as jobs in Tendu so the family splits them.']]],
   src:S('GOV.UK: what to do when someone dies','https://www.gov.uk/when-someone-dies')},
  {id:'hearing', cat:'conditions', t:'Sight and hearing loss', sub:'Noticing it and making life easier', needs:['sight','older','ld','dementia'],
   body:[['Signs of hearing loss',['Mishearing people, especially in noisy places.','Asking people to repeat themselves.','The TV louder than others like it.','Tired from concentrating to listen.']],
         ['When to get help',['See the GP if hearing has been getting slowly worse.','Get urgent advice from NHS 111 for sudden hearing loss, or loss with earache or discharge.']],
         ['Everyday tips',['Face the person in good light and don’t cover your mouth.','Keep hearing aids and glasses clean, charged and to hand. Note them on the emergency card.','Regular sight tests matter. Many people, including everyone over 60, get them free on the NHS.']]],
   src:S('NHS: hearing loss','https://www.nhs.uk/conditions/hearing-loss/')},
  {id:'safesleep', cat:'daily', t:'Safe sleep for babies', sub:'Reduce the risk of sudden infant death', needs:['baby','child'],
   body:[['Every sleep',['Always put babies on their back, feet to the foot of the cot.','Keep the cot or Moses basket in your room for at least the first 6 months.','Use a firm, flat mattress. No pillows, duvets, bumpers or soft toys.','Keep the room between 16 and 20°C.']],
         ['Avoid',['Sleeping with a baby on a sofa or armchair.','Sharing a bed if anyone smokes, has been drinking, or takes medicine that makes them drowsy.','Smoke around the baby.','Long periods in a car seat outside of travel.']],
         ['Support',['The Lullaby Trust helpline: 0808 802 6868.']]],
   src:S('NHS: reduce the risk of SIDS','https://www.nhs.uk/baby/caring-for-a-newborn/reduce-the-risk-of-sudden-infant-death-syndrome/')},
  {id:'teen', cat:'conditions', t:'A teenager having a hard time', sub:'Mental health support for young people', needs:['teen','mental','autism','child'],
   body:[['How to help',['Find a calm moment to talk, side by side works well, like in the car or on a walk.','Listen more than you talk. Don’t rush to fix it.','Keep routines: sleep, food and time outside help.','Talk to school. They may have a counsellor or mental health support team.']],
         ['Getting help',['The GP can refer to children and young people’s mental health services.','If you think they are in danger, call 999. For urgent help, call 111 and choose the mental health option.','Young people can call Childline free on 0800 1111.']]],
   src:S('NHS: mental health for children and young people','https://www.nhs.uk/mental-health/children-and-young-adults/')},
  {id:'recovery', cat:'daily', t:'Recovering at home', sub:'After hospital, an injury or an operation', needs:['hospital','older','self','physical'],
   body:[['The first days',['Read the discharge letter together and keep it in Documents.','Check who to call if worried, and save the number.','Make sure medicines, food and any equipment are in place.','Plan who checks in, especially the first night.']],
         ['Watch for',['Signs of infection at a wound: more redness, swelling, heat, pus or a high temperature. Contact the GP, 111, or the ward on the letter.','Signs of sepsis or sudden confusion are emergencies: see those guides.']],
         ['Getting back to normal',['Ask about reablement: short-term free help at home after hospital.','Build up activity slowly as advised.']]],
   src:S('NHS: planning to leave hospital','https://www.nhs.uk/social-care-and-support/care-after-a-hospital-stay/planning-to-leave-hospital/')},
  {id:'carehome', cat:'money', t:'Moving into a care home', sub:'Choosing, paying and settling in', needs:['moving','older','dementia','eol'],
   body:[['First steps',['Ask the council for a needs assessment. It decides what care is needed.','The council also does a financial assessment to work out what they pay.','Visit more than one home, at different times of day.']],
         ['Check',['The home’s latest inspection report (CQC in England).','How they will get to know the person: share the “This is me” profile.','What’s included in the fees.']]],
   src:S('NHS: care homes','https://www.nhs.uk/social-care-and-support/care-services-equipment-and-care-homes/care-homes/')},
  {id:'team', cat:'you', t:'Sharing care as a team', sub:'How families make it work', needs:['older','dementia','child','self','physical','ld','autism','mental','hospital'],
   body:[['Agree the basics',['Hold a short family meeting. Agree who does what, and say what each person can realistically give.','Distant relatives can still help: paperwork, calls, bills, booking appointments.','Use the rota so visits are spread out and gaps show up early.']],
         ['Keep it fair',['Write jobs down and let people claim them, rather than one person carrying everything.','Track shared costs so money doesn’t become an argument.','Review every few months. Needs change.']]],
   src:S('Carers UK: help and advice','https://www.carersuk.org/help-and-advice/')}
,
  {id:'respect', cat:'money', t:'ReSPECT and planning ahead', sub:'Emergency care plans, advance decisions and LPA', needs:['eol','older','dementia','cancer','heart','parkinsons','ld','stroke','physical'],
   body:[['What ReSPECT is',['ReSPECT stands for Recommended Summary Plan for Emergency Care and Treatment.','It is a personal recommendation about care in an emergency, for times when the person can’t make or express decisions themselves.','It is made through conversations between the person, the people important to them, and their doctor or nurse, about what matters most to them and which treatments would or wouldn’t be wanted or helpful.','It is most relevant for people with complex health needs or nearing the end of life.']],
         ['Keeping it useful',['The form stays with the person and should be available straight away to anyone called to help in an emergency, at home or elsewhere. Keep the original somewhere agreed and easy to find, and tell the family where.','A ReSPECT plan can’t be used to demand treatments that are unlikely to help.','In an emergency, clinicians still make decisions in the person’s best interests.','Ask for it to be reviewed if health or wishes change.']],
         ['Related documents',['Advance decision to refuse treatment (ADRT): a legally binding decision to refuse specific treatments in future. Useful where ReSPECT isn’t used locally.','Advance statement: wishes and preferences about care. Not legally binding, but must be taken into account.','Lasting Power of Attorney for health and welfare: lets a trusted person make decisions if the person can’t.','DNACPR: a decision about cardiopulmonary resuscitation, often recorded on the ReSPECT form.']],
         ['In Tendu',['Record that a form exists and where it’s kept on the emergency card.','Save a photo in Documents and tick “show on the emergency card”.','Tendu only records what you tell it. It doesn’t replace the original form.']]],
   src:S('Resuscitation Council UK: ReSPECT for patients and carers','https://www.resus.org.uk/respect/respect-patients-and-carers')}
];
const QUIZZES = [
  {id:'q-respect', t:'Planning ahead', s:'ReSPECT, LPA and advance decisions', qs:[
    ['A ReSPECT form is made by:', ['The family alone','The person and their doctor or nurse, with people important to them','A solicitor only','The ambulance service'], 1, 'It comes from conversations between the person, those close to them, and health professionals.'],
    ['Where should the ReSPECT form be kept?', ['Locked in a safe','With the person, easy for emergency staff to find','At the GP only','It doesn’t matter'], 1, 'It should be immediately available to anyone called to help in an emergency.'],
    ['Can a ReSPECT form demand a treatment that is unlikely to help?', ['Yes','No'], 1, 'It records recommendations and wishes, but can’t demand treatments unlikely to benefit the person.'],
    ['Which is legally binding when valid?', ['An advance statement','An advance decision to refuse treatment (ADRT)','A note on the fridge','A text message'], 1, 'A valid ADRT is legally binding. An advance statement must be taken into account but isn’t binding.']]},
  {id:'q-baby', t:'Babies and young children', s:'Safe sleep and fevers', qs:[
    ['The safest position for a baby to sleep is:', ['On their front','On their side','On their back, feet to the foot of the cot','Propped on a pillow'], 2, 'Always on their back, feet to foot, on a firm, flat mattress.'],
    ['For the first 6 months, a baby should sleep:', ['In their own cot in your room','In a separate room','On the sofa with you','In a car seat'], 0, 'In a cot or Moses basket in the same room as you.'],
    ['The ideal room temperature for a sleeping baby is:', ['10 to 14°C','16 to 20°C','22 to 26°C','Over 26°C'], 1, 'The NHS advises 16 to 20°C.']]},
  {id:'q-life', t:'Life admin and wellbeing', s:'Money, grief and loneliness', qs:[
    ['Which bill counts as a priority debt?', ['A store card','Council tax','A loan from a friend','A phone upgrade'], 1, 'Council tax, rent or mortgage, energy and court fines come first.'],
    ['Debt advice should cost:', ['Nothing: free regulated services exist','£50','10% of the debt','A monthly fee'], 0, 'Never pay for debt advice. MoneyHelper lists free services.'],
    ['After a death, Tell Us Once lets you:', ['Skip registering the death','Tell most government services in one go','Close bank accounts','Get probate'], 1, 'It informs many government services at once.'],
    ['Low mood after a loss has lasted over 2 weeks. A good next step is:', ['Wait it out','See a GP','Drink to relax','Stay home alone'], 1, 'The NHS suggests seeing a GP if low mood lasts more than 2 weeks.']]},
  {id:'q-emergency', t:'Spot an emergency', s:'Stroke, sepsis and heart attack', qs:[
    ['In the FAST test for stroke, what does the T stand for?', ['Temperature','Time to call 999','Tablets','Talk slowly'], 1, 'Time: call 999 straight away, even if the signs go away.'],
    ['Stroke signs came on this morning and have now gone. What should you do?', ['Wait and see','Book a GP appointment next week','Call 999','Give a painkiller'], 2, 'Signs within the last 24 hours still need 999, even if they’ve stopped.'],
    ['Someone with an infection is confused, breathing very fast and has blotchy skin. This could be:', ['A cold','Sepsis: call 999','Tiredness','Hay fever'], 1, 'These are sepsis warning signs. Call 999 or go to A&E.'],
    ['Crushing chest pain spreading to the jaw. What first?', ['Call 999','Lie them flat and wait','Drive them to the GP','Give food'], 0, 'Call 999, help them sit with knees bent and back supported.']]},
  {id:'q-choking', t:'Choking and falls', s:'Practical first steps', qs:[
    ['An adult is choking but can still cough. You should:', ['Give back blows straight away','Encourage them to keep coughing','Give them water','Lie them down'], 1, 'If they can cough, coughing is the best way to clear it.'],
    ['If back blows don’t work, the next step for an adult is:', ['Up to 5 abdominal thrusts','A glass of water','Wait 10 minutes','Shake them'], 0, 'Up to 5 abdominal thrusts, then call 999 if it is still blocked.'],
    ['After a fall, when should you call 999?', ['Never','If they may have hurt their head, neck, back or hip, or can’t get up','Only if they ask','Only at night'], 1, 'Those are the NHS reasons to call 999 after a fall.'],
    ['Waiting for help after a fall, you should:', ['Keep them warm','Make them stand quickly','Give them a big meal','Leave them alone'], 0, 'Keep warm and help them change position gently every 30 minutes.']]},
  {id:'q-child', t:'A child with a temperature', s:'Know the red flags', qs:[
    ['A baby under 3 months has a temperature of 38°C. You should:', ['Wait until tomorrow','Call 111 for urgent advice','Give a cold bath','Nothing'], 1, 'Under 3 months with 38°C or higher needs urgent advice: call 111.'],
    ['Which of these means call 999?', ['A runny nose','A rash that doesn’t fade under a glass','Mild cough','Tiredness after school'], 1, 'A rash that doesn’t fade when pressed with a glass is an emergency sign.'],
    ['A child is drowsy and hard to wake. You should:', ['Let them sleep','Call 999','Give a snack','Try again later'], 1, 'Being drowsy and hard to wake is a reason to call 999.']]},
  {id:'q-everyday', t:'Everyday care', s:'Fluids, skin and confusion', qs:[
    ['Which is a sign of dehydration?', ['Pale yellow pee','Dark, strong-smelling pee','Feeling full','Clear thinking'], 1, 'Dark yellow, strong-smelling pee is a common sign.'],
    ['An early sign of a pressure sore is:', ['Skin that doesn’t change colour when pressed','A bruise from a knock','Dry hands','Freckles'], 0, 'Skin that stays red (or purple or blue on darker skin) when pressed can be an early sign.'],
    ['An older person becomes confused suddenly over a day. This:', ['Is just old age','Needs urgent help: the NHS says 999 or A&E','Can wait for a routine appointment','Is caused by tiredness'], 1, 'Sudden confusion can have serious causes such as infection or stroke.']]},
  {id:'q-mental', t:'Mental health and support', s:'Who to call and how to help', qs:[
    ['Samaritans can be called free, any time, on:', ['999','116 123','111','0800 1111'], 1, 'Samaritans: 116 123.'],
    ['For urgent mental health help that isn’t a 999 emergency in England:', ['Call 111 and choose the mental health option','Email the GP','Wait a week','Post online'], 0, 'NHS 111 has a mental health option.'],
    ['Talking with someone with dementia, it helps to:', ['Ask several questions at once','Speak in short sentences and give time','Talk about them as if they’re not there','Keep the TV loud'], 1, 'Short sentences, time to answer, and calm, simple choices.']]}
];

function libFor(c){ const n = (c && c.needs) || []; return LIB.filter(a => a.needs.some(x => n.includes(x))); }
function libRow(a){ return li({icon: LIB_CATS.find(x => x.id === a.cat).icon, tone: a.urgent ? 'c-crit' : LIB_CATS.find(x => x.id === a.cat).tone, title:esc(a.t), sub:esc(a.sub), a:'openArticle', v:a.id}); }
ACTIONS.openArticle = v => { App.sheet = null; App.capPreview = null; go('article', {id:v}); };

PAGES.library = (c) => {
  const q = (App.libQ || '').trim().toLowerCase(), cat = App.libCat;
  const done = (D().learn || {});
  let list = '';
  if (q.length > 1){
    const hits = LIB.filter(a => (a.t + ' ' + a.sub + ' ' + a.body.flat(2).join(' ')).toLowerCase().includes(q));
    list = hits.length ? `<div class="list">${hits.map(libRow).join('')}</div>` : `<div class="card">${empty('search', 'Nothing found', 'Try another word, or ask the assistant.')}</div>`;
  } else if (cat){
    const C = LIB_CATS.find(x => x.id === cat);
    list = `<div class="sechead"><h2>${esc(C.t)}</h2><button class="more" data-a="libCat" data-v="">All topics</button></div><div class="list">${LIB.filter(a => a.cat === cat).map(libRow).join('')}</div>`;
  } else {
    const mine = libFor(c);
    list = `${mine.length ? `<div class="section" style="margin-top:4px"><div class="sechead"><h2>For ${esc(whoName(c))}</h2><button class="more" data-a="sheet" data-v="needs">Edit needs</button></div><div class="hscroll">${mine.slice(0,10).map(a => `<button class="nudge" data-a="openArticle" data-v="${a.id}" style="flex-basis:70%"><span class="tile ${a.urgent ? 'c-crit' : 'c-accent'}">${ic(a.urgent ? 'siren' : 'book')}</span><span><div class="ttl">${esc(a.t)}</div><div class="sub">${esc(a.sub)}</div></span></button>`).join('')}</div></div>`
      : `<div class="card tint small" style="margin-bottom:6px">Tell Tendu about ${esc(whoName(c))}’s needs to see the guides that matter most. <button class="textbtn" data-a="sheet" data-v="needs">Choose needs</button></div>`}
      <div class="section"><div class="sechead"><h2>Browse</h2></div><div class="list">${LIB_CATS.map(C => li({icon:C.icon, tone:C.tone, title:esc(C.t), sub:esc(C.s) + ` · ${LIB.filter(a => a.cat === C.id).length} guides`, a:'libCat', v:C.id})).join('')}</div></div>
      <div class="section"><div class="sechead"><h2>Practise</h2><span class="tiny muted">${Object.keys(done).length} of ${QUIZZES.length} done</span></div><div class="list">${QUIZZES.map(z => li({icon: done[z.id] ? 'checkCircle' : 'bolt', tone: done[z.id] ? 'c-good' : 'c-accent', title:esc(z.t), sub:esc(z.s) + (done[z.id] ? ` · best ${done[z.id]}/${z.qs.length}` : ` · ${z.qs.length} questions`), a:'openQuiz', v:z.id})).join('')}</div></div>`;
  }
  return `${bar('Care Library', {right:`<button class="textbtn" data-a="go" data-v="assistant">Ask</button>`})}
    <h1 class="largetitle">Care Library</h1><p class="subtitle">Trusted guides for every age and situation, from NHS and official sources.</p>
    <div class="card" style="border:2px solid var(--crit);box-shadow:none;padding:12px 14px"><div class="row"><span class="tile c-crit" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center">${ic('siren','style="width:20px;height:20px"')}</span><div class="grow small"><b>Emergency? Call 999.</b> For urgent advice call NHS 111.</div><button class="claim" style="background:var(--crit-soft);color:var(--crit)" data-a="libCat" data-v="urgent">Signs</button></div></div>
    <input class="input mt12" type="search" placeholder="Search: stroke, PIP, autism, falls…" value="${esc(App.libQ || '')}" data-libsearch aria-label="Search the Care Library">
    <div class="section" style="margin-top:14px">${list}</div>
    <p class="disclaim">General information to help you get the right help, not a diagnosis or personal medical advice. If you’re worried about someone, contact their GP, NHS 111, or 999 in an emergency.</p>`;
};
ACTIONS.libCat = v => { App.libCat = v || null; App.libQ = ''; render(); window.scrollTo(0,0); };
document.addEventListener('input', debounce(e => { if (e.target.matches('[data-libsearch]')){ App.libQ = e.target.value; const pos = e.target.selectionStart; render(); const s = document.querySelector('[data-libsearch]'); if (s){ s.focus(); s.setSelectionRange(pos, pos); } } }, 220));

PAGES.article = (c, p) => {
  const a = LIB.find(x => x.id === p.id) || LIB[0];
  const related = LIB.filter(x => x.id !== a.id && (x.cat === a.cat || x.needs.some(n => a.needs.includes(n)))).slice(0,3);
  return `${bar(LIB_CATS.find(x => x.id === a.cat).t)}
    ${a.urgent ? `<span class="badge crit" style="margin:6px 2px 0">${ic('siren','style="width:13px;height:13px"')}Emergency guide</span>` : ''}
    <h1 class="largetitle">${esc(a.t)}</h1><p class="subtitle">${esc(a.sub)}</p>
    <div class="stack">${a.body.map(([h, items]) => `<section class="card"><h3 style="margin:0 0 8px;font-size:1.05rem">${esc(h)}</h3><ul style="margin:0;padding-left:20px;line-height:1.6">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('')}</div>
    <a class="li card flat mt12" href="${a.src.url}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;border-radius:16px"><span class="tile c-plain">${ic('book')}</span><span class="main"><div class="ttl">Source: ${esc(a.src.name)}</div><div class="sub">Opens the official page</div></span>${chevron()}</a>
    <div class="btnrow mt12"><button class="btn secondary" data-a="askAbout" data-v="${a.id}">${ic('sparkle')}Ask about this</button><button class="btn ghost" data-a="shareArticle" data-v="${a.id}">${ic('share')}Share</button></div>
    ${related.length ? `<div class="section"><div class="sechead"><h2>Related</h2></div><div class="list">${related.map(libRow).join('')}</div></div>` : ''}
    <p class="disclaim">General information, not personal medical advice. In an emergency call 999.</p>`;
};
ACTIONS.shareArticle = v => { const a = LIB.find(x => x.id === v); shareText(a.t, `${a.t}\n\n` + a.body.map(([h, it]) => h + ':\n' + it.map(x => '• ' + x).join('\n')).join('\n\n') + `\n\nSource: ${a.src.name} ${a.src.url}`); };
ACTIONS.askAbout = v => { const a = LIB.find(x => x.id === v); App.aiDraft = `Help me understand “${a.t}” for ${whoName(circle())}, and what I should do next.`; go('assistant'); };

ACTIONS.openQuiz = v => { App.quiz = {id:v, i:0, score:0, picked:null}; go('quiz'); };
PAGES.quiz = () => {
  const z = QUIZZES.find(x => x.id === App.quiz.id), st = App.quiz;
  if (st.i >= z.qs.length){
    const learn = D().learn = D().learn || {}; learn[z.id] = Math.max(learn[z.id] || 0, st.score); save();
    return `${bar('Practice')}<div class="center mt24"><div class="empty"><div class="art" style="background:var(--good-soft);color:var(--good)">${ic('star')}</div><b style="font-size:1.4rem">${st.score} of ${z.qs.length}</b><div>${st.score === z.qs.length ? 'Perfect. You know what to look for.' : 'Good practice. Read the guides and try again any time.'}</div></div>
      <div class="btnrow mt16"><button class="btn ghost" data-a="openQuiz" data-v="${z.id}">Try again</button><button class="btn" data-a="back">Done</button></div></div>`;
  }
  const [q, opts, right, why] = z.qs[st.i];
  return `${bar(z.t)}<div class="steps" aria-hidden="true">${z.qs.map((_, k) => `<i class="${k <= st.i ? 'on' : ''}"></i>`).join('')}</div>
    <h1 class="largetitle" style="font-size:1.6rem">${esc(q)}</h1>
    <div class="stack mt16">${opts.map((o, k) => { const state = st.picked === null ? '' : k === right ? 'good' : k === st.picked ? 'crit' : '';
      return `<button class="li card flat" style="border-radius:16px;${state ? `border-color:var(--${state});background:var(--${state}-soft)` : ''}" data-a="quizPick" data-v="${k}" ${st.picked !== null ? 'disabled' : ''}><span class="main"><div class="ttl" style="font-weight:550">${esc(o)}</div></span>${state === 'good' ? ic('checkCircle','style="width:22px;height:22px;color:var(--good)"') : ''}</button>`; }).join('')}</div>
    ${st.picked !== null ? `<div class="card ${st.picked === right ? 'tint' : 'accent'} mt16"><b>${st.picked === right ? 'Right.' : 'Not quite.'}</b> ${esc(why)}</div><button class="btn mt16" data-a="quizNext">${st.i + 1 < z.qs.length ? 'Next question' : 'See my score'}</button>` : ''}`;
};
ACTIONS.quizPick = v => { const z = QUIZZES.find(x => x.id === App.quiz.id); App.quiz.picked = +v; if (+v === z.qs[App.quiz.i][2]) App.quiz.score++; render(); };
ACTIONS.quizNext = () => { App.quiz.i++; App.quiz.picked = null; render(); window.scrollTo(0,0); };

function parseJson(t){ if (typeof t === 'object' && t) return t; const m = String(t || '').match(/\{[\s\S]*\}/); if (!m) return {reply:String(t || '')}; try { return JSON.parse(m[0]); } catch(e){ return {reply:String(t)}; } }

async function askClaudeKey(c, history, text, image){
  const p = aiPrefs();
  const content = image ? [{type:'image', source:{type:'base64', media_type:'image/jpeg', data:image.split(',')[1]}}, {type:'text', text: text || 'Please read this letter or document and explain it simply.'}] : text;
  const msgs = history.slice(-10).filter(m => m.text).map(m => ({role: m.role === 'me' ? 'user' : 'assistant', content: m.role === 'me' ? m.text : JSON.stringify({reply:m.text})}));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  msgs.push({role:'user', content});
  const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json', 'x-api-key':p.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:p.model || 'claude-sonnet-5-5', max_tokens:1200, system:aiSystem(c), messages:msgs})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('The AI service replied ' + r.status));
  return parseJson((j.content || []).map(b => b.text || '').join(''));
}

function localAnswer(c, q){
  const t = q.toLowerCase(), who = whoName(c), out = {reply:'', tasks:[], articles:[], message:'', plan:''};
  const words = t.replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 3 && !['what','when','with','have','does','that','this','about','should','could','would','there','their','help','need','know','please','tell','someone','where','which'].includes(w));
  const hits = LIB.map(a => { const hay = (a.t + ' ' + a.sub + ' ' + a.body.flat(2).join(' ')).toLowerCase(); return [a, words.reduce((n, w) => n + (hay.includes(w) ? (a.t.toLowerCase().includes(w) ? 3 : 1) : 0), 0)]; }).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  if (URGENT_RX.test(q)){ out.reply = URGENT_REPLY + '\n\nThe guides below show what the NHS says to look for and do while you wait.'; const map = [[/chest|heart/, 'heartattack'], [/stroke|droop|slurred/, 'stroke'], [/chok/, 'choking'], [/sepsis|infection|blotchy|rash/, 'sepsis'], [/suicid|self[- ]harm|kill/, 'mhcrisis'], [/confus/, 'confusion'], [/fell|fall/, 'fall'], [/sugar|hypo|diabet/, 'hypo'], [/baby|child|temperature|fever/, 'childfever']];
    out.articles = map.filter(([rx]) => rx.test(t)).map(m => m[1]); if (!out.articles.length) out.articles = hits.filter(a => a.urgent).map(a => a.id); if (!out.articles.length) out.articles = ['stroke','heartattack','mhcrisis']; out.articles = out.articles.slice(0, 3); return out; }
  if (/\b(today|on today|this morning|this afternoon|what'?s on|schedule|agenda)\b/.test(t)){
    const td = openItems(c).filter(i => i.date === todayIso()), rs = routinesToday(c);
    out.reply = td.length || rs.length ? `Today for ${who}:\n\n${td.map(i => `• ${i.time ? i.time + ' ' : ''}${i.title}${i.owner ? ' (' + firstName(memberName(i.owner, c)) + ')' : ' (nobody yet)'}`).join('\n')}${rs.length ? (td.length ? '\n' : '') + rs.map(r => `• Routine: ${r.title}${r.time ? ' at ' + r.time : ''}`).join('\n') : ''}` : `Nothing is booked for ${who} today. Tap + to add something, or set up a daily routine.`; return out; }
  if (/(unclaimed|nobody|no one|needs? someone|who is doing|who'?s doing|share (the )?(jobs|load))/.test(t)){ const u = unclaimed(c);
    out.reply = u.length ? `${u.length} ${u.length === 1 ? 'job needs' : 'jobs need'} someone:\n\n${u.map(i => '• ' + i.title + (i.date ? ' (' + niceDate(i.date) + ')' : '')).join('\n')}\n\nI’ve drafted a message you can send to the team.` : 'Every job has someone on it. Nice teamwork.';
    if (u.length) out.message = `Hi all, a few things for ${who} need someone:\n${u.map(i => '- ' + i.title + (i.date ? ' (' + niceDate(i.date) + ')' : '')).join('\n')}\nCan anyone take one? Claim it in Tendu. Thank you.`; return out; }
  if (/(waiting|chase|heard back|no reply)/.test(t)){ const w = c.waiting.filter(x => !x.done); out.reply = w.length ? `You’re waiting on:\n\n${w.map(x => `• ${x.title} from ${x.from}${daysFromToday(x.due) < 0 ? ' (late)' : ''}`).join('\n')}\n\nOpen “Waiting on” to send a ready-written chaser.` : 'You’re not waiting on anything right now.'; return out; }

const SERVER_SQL = `create table if not exists public.tendu_msgs (
  id uuid primary key,
  seq bigint generated always as identity,
  room text not null,
  at bigint not null,
  iv text not null,
  ct text not null
);
create index if not exists tendu_msgs_room_seq on public.tendu_msgs (room, seq);
create table if not exists public.tendu_recovery (
  user_id uuid primary key default auth.uid() references auth.users(id) on delete cascade,
  secret text not null check (length(secret) between 40 and 64),
  created_at timestamptz not null default now()
);
create policy "own secret read" on public.tendu_recovery for select to authenticated using (user_id = auth.uid());
create policy "own secret insert" on public.tendu_recovery for insert to authenticated with check (user_id = auth.uid());
begin;

create table if not exists public.tendu_rooms (
  room text primary key check (length(room) = 32),
  token_hash text not null check (length(token_hash) = 64),
  created_at timestamptz not null default now()
);
alter table public.tendu_rooms enable row level security;
revoke all on public.tendu_rooms from public, anon, authenticated;

-- no direct table access to the relay any more
drop policy if exists "tendu insert" on public.tendu_msgs;
drop policy if exists "tendu read" on public.tendu_msgs;
alter table public.tendu_msgs enable row level security;
revoke all on public.tendu_msgs from public, anon, authenticated;

-- the room check: the first device to use a room registers its token hash (rooms made before 5.0.1 are
-- claimed this way the first time an updated app opens them); after that, only the same token is accepted
create or replace function public.tendu_room_ok(p_room text, p_token text) returns boolean
language plpgsql security definer set search_path = public as $$
declare h text;
begin
  if p_room is null or p_room !~ '^[0-9a-f]{32}$' or p_token is null or p_token !~ '^[0-9a-f]{64}$' then return false; end if;
  h := encode(sha256(convert_to(p_token, 'UTF8')), 'hex');
  insert into public.tendu_rooms(room, token_hash) values (p_room, h) on conflict (room) do nothing;
  return exists (select 1 from public.tendu_rooms r where r.room = p_room and r.token_hash = h);
end $$;

create or replace function public.tendu_post(p_room text, p_token text, p_id uuid, p_at bigint, p_iv text, p_ct text) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not public.tendu_room_ok(p_room, p_token) then raise exception 'not allowed' using errcode = '42501'; end if;
  if p_iv is null or p_ct is null or length(p_iv) > 64 or length(p_ct) >= 700000 then raise exception 'bad message' using errcode = '22023'; end if;
  insert into public.tendu_msgs(id, room, at, iv, ct) values (p_id, p_room, p_at, p_iv, p_ct) on conflict (id) do nothing;
end $$;

create or replace function public.tendu_pull(p_room text, p_token text, p_since bigint) returns table(id uuid, seq bigint, at bigint, iv text, ct text)
language plpgsql security definer set search_path = public as $$
begin
  if not public.tendu_room_ok(p_room, p_token) then raise exception 'not allowed' using errcode = '42501'; end if;
  return query select m.id, m.seq, m.at, m.iv, m.ct from public.tendu_msgs m
    where m.room = p_room and m.seq > coalesce(p_since, 0) order by m.seq limit 200;
end $$;

revoke all on function public.tendu_room_ok(text, text) from public, anon, authenticated;
revoke all on function public.tendu_post(text, text, uuid, bigint, text, text) from public;
revoke all on function public.tendu_pull(text, text, bigint) from public;
grant execute on function public.tendu_post(text, text, uuid, bigint, text, text) to anon, authenticated;
grant execute on function public.tendu_pull(text, text, bigint) to anon, authenticated;

-- the email sign-in secrets: signed-in users read and add only their own; nobody else, never anonymous
alter table public.tendu_recovery enable row level security;
revoke all on public.tendu_recovery from public, anon;
revoke update, delete on public.tendu_recovery from authenticated;
grant select, insert on public.tendu_recovery to authenticated;

commit;
`;

const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
const b64u = s => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return s; };
const _ckeys = {};

const Sync = {
  cfg(){ const s = D().prefs.server; return s && s.url && s.anon ? s : null; },
  on(c){ return !!(this.cfg() && c.share && c.share.room); },
  async key(c){ const r = c.share.room; return _ckeys[r] || (_ckeys[r] = await crypto.subtle.importKey('raw', unb64(c.share.key), 'AES-GCM', false, ['encrypt','decrypt'])); },
  headers(){ const s = this.cfg(); return {'apikey':s.anon, 'Authorization':'Bearer ' + s.anon, 'content-type':'application/json'}; },
  rpc(name){ return this.cfg().url.replace(/\/+$/, '') + '/rest/v1/rpc/' + name; },
  async token(c){ const k = c.share.key; if (_ckeys['t:' + k]) return _ckeys['t:' + k]; const d = await crypto.subtle.digest('SHA-256', enc.encode('tendu-room-token:' + k)); return _ckeys['t:' + k] = Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, '0')).join(''); },
  async send(c, m){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const body = {id:m.id, s:m.s, n:m.n, t:m.t, at:m.at, k:m.k, ref:m.ref || '', img:m.img || '', key:m.key, v:m.v, u:m.u, del:m.del};
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await this.key(c), enc.encode(JSON.stringify(body)));
    const r = await fetch(this.rpc('tendu_post'), {method:'POST', headers:this.headers(), body:JSON.stringify({p_room:c.share.room, p_token:await this.token(c), p_id:m.id, p_at:m.at, p_iv:b64(iv), p_ct:b64(ct)})});
    if (!r.ok) throw new Error('Server replied ' + r.status);
  },
  async pull(c){
    let fresh = [], recs = [], more = true, loops = 0;
    while (more && loops++ < 10){
      const since = c.share.seq || 0;
      const r = await fetch(this.rpc('tendu_pull'), {method:'POST', headers:this.headers(), body:JSON.stringify({p_room:c.share.room, p_token:await this.token(c), p_since:since})});
      if (!r.ok) throw new Error('Server replied ' + r.status);
      const rows = await r.json(); more = rows.length === 200;
      for (const row of rows){
        c.share.seq = Math.max(c.share.seq || 0, row.seq || 0);
        const mine = (c.chat || []).find(x => x.id === row.id); if (mine){ if (mine.st) delete mine.st; continue; }
        try { const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(row.iv)}, await this.key(c), unb64(row.ct)); const m = JSON.parse(dec.decode(pt)); m.id = row.id;
          if (m.k === 'rec'){ if (m.s !== D().me.id) recs.push(m); continue; }
          fresh.push(m); } catch(e){ /* not ours or tampered: ignore */ }
      }
      if (rows.length) save();
    }
    if (fresh.length){ c.chat = (c.chat || []).concat(fresh).sort((a, b) => a.at - b.at); if (c.chat.length > 600) c.chat = c.chat.slice(-600); }
    if (recs.length && typeof applyRecs === 'function') applyRecs(c, recs);
    if (typeof syncCaughtUp === 'function') syncCaughtUp(c);
    return fresh;
  }
};

function chatMsgs(c){ return c.chat = c.chat || []; }

let _tick = 0, _pulling = false;
setInterval(async () => {
  if (!Session.data || document.hidden || _pulling) return;
  const c = circle(); if (!c || !Sync.on(c)) return;

  if (!viewing && (_tick++ % 3)) return;
  _pulling = true;
  try {
    const fresh = await Sync.pull(c); const others = fresh.filter(m => m.s !== D().me.id);
    if (others.length){
      const typing = document.activeElement && document.activeElement.matches('textarea, input');
      if (viewing){ const ta = document.querySelector('.chatin textarea'), val = ta ? ta.value : '', foc = ta && document.activeElement === ta; render(); const t2 = document.querySelector('.chatin textarea'); if (t2){ t2.value = val; if (foc) t2.focus(); } scrollChatEnd(); }
      else { toast(`${others[others.length - 1].n}: ${others[others.length - 1].t.slice(0, 60)}`, 'chat'); if (!typing && TABS.includes(App.route.name)) render(); }
    }
  } catch(e){} finally { _pulling = false; }
}, 3000);

function sitFor(c){ const n = c.needs || []; return SITUATIONS.filter(s => s.always || s.needs.some(x => n.includes(x))); }

function sugState(c, k){ return (c.sugg || {})[k]; }

function suggestCard(c){
  const pool = []; sitFor(c).forEach(s => s.items.forEach((it, i) => { if (!sugState(c, sugKey(s.id, i))) pool.push([s, it, i]); }));
  if (!pool.length || c.suggHidden) return '';

  return `<div class="section"><div class="sechead"><h2>Ideas for ${esc(whoName(c))}</h2><button class="more" data-a="go" data-v="situations">See all</button></div>

}

  return `<div class="card sug ${st ? 'decided' : ''}" style="padding:12px 14px"><div class="row" style="gap:10px;align-items:flex-start"><span class="tile c-accent" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none">${ic(SG[g][1],'style="width:18px;height:18px"')}</span>

    <div class="tiny mt4">${compact ? esc(s.title) + ' · ' : ''}${so ? `<a href="${so[1]}" target="_blank" rel="noopener" class="srclink">${esc(so[0])}</a>` : '<span class="muted">Idea from Tendu</span>'}</div></div></div>
    <div class="row mt8" style="gap:8px;justify-content:flex-end">${st === 'added' ? `<span class="badge good">${ic('check','style="width:13px;height:13px"')}In the plan</span>` : st === 'no' ? `<span class="badge">Not for us</span><button class="textbtn small" data-a="sugUndo" data-v="${k}">Undo</button>` : `<button class="claim ghostish" data-a="sugNo" data-v="${k}">Not for us</button><button class="claim" data-a="sugAdd" data-v="${k}">${ic('plus','style="width:14px;height:14px;vertical-align:-2px"')} Add to plan</button>`}</div></div>`;

function shareStats(c, days = 30){
  const since = Date.now() - days * 864e5, sinceIso = plusDays(-days);
  return c.members.map(m => {
    const jobs = c.items.filter(i => i.done && i.doneBy === m.id && i.doneAt >= since).length;
    const visits = c.visits.filter(v => v.memberId === m.id && v.date >= sinceIso && v.date <= todayIso()).length;
    const claimed = openItems(c).filter(i => i.owner === m.id).length;
    const paid = c.costs.filter(x => x.paidBy === m.id && x.date >= sinceIso).reduce((s, x) => s + x.amount, 0);
    const checks = Object.entries(c.checkins).filter(([d, x]) => d >= sinceIso && x.by === m.id).length;
    return {m, jobs, visits, claimed, paid, checks, score: jobs + visits * 2 + checks + claimed * .5};
  }).sort((a, b) => b.score - a.score);
}

function weekChanges(c){ const inRange = (d, a, b) => { const n = daysFromToday(d); return n <= a && n > b; };

  const now = count(0, -7), before = count(-7, -14), keys = [...new Set([...Object.keys(now), ...Object.keys(before)])];
  const lines = keys.map(k => ({k, t:(OBS.find(x => x.k === k) || {t:k}).t, n:now[k] || 0, p:before[k] || 0})).filter(x => x.n !== x.p).sort((a, b) => Math.abs(b.n - b.p) - Math.abs(a.n - a.p));
  const chk = d => !!c.checkins[plusDays(-d)]; let missed = 0; for (let d = 0; d < 7; d++) if (!chk(d)) missed++;

const Care = {
  days(n = 7, from = todayIso()){ return Array.from({length:n}, (_, k) => plusDays(k, from)); },
  usual(c, item){
    const tw = new Set(words(item && item.title)); if (!tw.size) return null; const since = Date.now() - 183 * 864e5, t = {};
    c.items.filter(i => i.done && i.doneBy && (i.doneAt || 0) >= since && i.id !== item.id && words(i.title).some(w => tw.has(w))).forEach(i => t[i.doneBy] = (t[i.doneBy] || 0) + 1);
    const best = Object.entries(t).sort((a, b) => b[1] - a[1])[0]; if (!best || best[1] < 2) return null;
    const m = member(best[0], c); return m ? {m, n:best[1]} : null; },
  load(c, n = 7){ const ds = new Set(Care.days(n)), out = {};
    c.members.forEach(m => out[m.id] = {m, jobs:0, visits:0, routines:0});
    openItems(c).forEach(i => { if (i.owner && out[i.owner] && i.date && ds.has(i.date)) out[i.owner].jobs++; });
    c.visits.forEach(v => { if (out[v.memberId] && ds.has(v.date)) out[v.memberId].visits++; });
    (c.routines || []).forEach(r => { if (r.owner && out[r.owner]) out[r.owner].routines++; });
    Object.values(out).forEach(x => x.total = x.jobs + x.visits + x.routines);
    const sum = Object.values(out).reduce((s, x) => s + x.total, 0);
    Object.values(out).forEach(x => x.share = sum ? x.total / sum : 0);

  uneven(c){ const l = Care.load(c), others = c.members.filter(m => !isAway(m)).length;
    if (c.members.length < 2 || others < 2 || l.sum < 5) return null;
    const top = [...l.per].sort((a, b) => b.total - a.total)[0]; return top.share >= .6 ? {...top, sum:l.sum} : null; },
  forecast(c, n = 7){ const alone = /alone/i.test(c.lives || '');
    return Care.days(n).map((d, k) => {
      const items = openItems(c).filter(i => i.date === d), away = c.members.filter(m => isAway(m, d)), vis = visitsOn(c, d), probs = [];

        if (o && isAway(o, d)) probs.push({p:1, key:'away-' + i.id + '-' + d, item:i, icon:'calendar', t:`${o.isMe ? 'You’re' : firstName(o.name) + ' is'} away for “${i.title}”`, s:(i.time ? i.time + ' · ' : '') + 'needs someone else',
          why:[`${o.isMe ? 'You are' : firstName(o.name) + ' is'} marked as away ${d === todayIso() ? 'today' : 'on ' + niceDate(d)}.`, `“${i.title}” is down for ${o.isMe ? 'you' : firstName(o.name)}.`]});
        else if (!o && (i.kind === 'appointment' || k <= 2)) probs.push({p:i.kind === 'appointment' ? 1 : 2, key:'none-' + i.id, item:i, icon:i.kind === 'appointment' ? 'hospital' : 'handshake', t:i.kind === 'appointment' ? `Nobody going to “${i.title}” yet` : `Nobody on “${i.title}” yet`, s:(i.time ? i.time + ' · ' : '') + (u && !isAway(u.m, d) ? `${u.m.isMe ? 'You usually do' : firstName(u.m.name) + ' usually does'} this` : 'needs someone'),
          why:[`“${i.title}” is planned for ${dayWord(d)} and nobody has said they’ll do it.`, u ? `${u.m.isMe ? 'You have' : firstName(u.m.name) + ' has'} done similar jobs ${u.n} times recently${isAway(u.m, d) ? ', but ' + (u.m.isMe ? 'you are' : 'they are') + ' away then' : ''}.` : ''].filter(Boolean)}); });
      c.meds.filter(m => m.supplyUntil === d).forEach(m => probs.push({p:2, key:'rx-' + m.id, icon:'pill', t:`${m.name} runs out ${dayWord(d)}`, s:'Repeat prescription', act:`<button class="claim" data-a="rxJob" data-id="${m.id}">Add a job</button>`, why:[`The medicines list says the supply of ${m.name} lasts until ${niceDate(d)}.`, 'This is the date the family entered. Tendu doesn’t know if it has already been ordered.']}));
      if (alone && c.members.length > 1 && !vis.length && !items.some(i => i.owner)) probs.push({p:3, key:'quiet-' + d, icon:'home', t:`Nobody seeing ${whoName(c)} ${dayWord(d)}`, s:'A visit or a call both count', act:`<button class="claim" data-a="addVisit" data-v="${d}">I’ll visit</button>`, why:[`${whoName(c)} lives alone.`, `There is no visit, call or job with someone on the rota for ${dayWord(d)}.`, 'Tendu only sees what’s in the plan. Someone may already be popping in.']});

      Object.entries(per).filter(([, v]) => v >= 4).forEach(([id, v]) => { const m = member(id, c); if (m) probs.push({p:3, key:'busy-' + id + '-' + d, icon:'users', t:`A full day for ${m.isMe ? 'you' : firstName(m.name)}`, s:`${v} jobs ${dayWord(d)}`, act:`<button class="claim" data-a="go" data-v="balance">Share some</button>`, why:[`${v} jobs on ${niceDate(d)} are down for ${m.isMe ? 'you' : firstName(m.name)}.`, 'Some of them might be easy for someone else to take.']}); });

      {ok:!!(e.allergies || e.gp), t:e.allergies || e.gp ? 'Emergency card has the key details' : 'Emergency card is missing key details', fix:e.allergies || e.gp ? null : ['Fill it in', 'sheet', 'editEmergency']},
      {ok:!!(cp && cp.reviewed && daysFromToday(cp.reviewed) > -183), t:!cp || !cp.reviewed ? 'No “If I can’t care” plan yet' : daysFromToday(cp.reviewed) > -183 ? 'Contingency plan is up to date' : 'Contingency plan needs a check', fix:cp && cp.reviewed && daysFromToday(cp.reviewed) > -183 ? null : ['Open the plan', 'go', 'contingency']},
      {ok:!c.meds.length || c.meds.some(m => m.changedAt && Date.now() - m.changedAt < 183 * 864e5), info:!c.meds.length, t:!c.meds.length ? 'No medicines recorded' : c.meds.some(m => m.changedAt && Date.now() - m.changedAt < 183 * 864e5) ? 'Medicines list checked in the last 6 months' : 'Medicines list not checked for 6 months', fix:c.meds.length && !c.meds.some(m => m.changedAt && Date.now() - m.changedAt < 183 * 864e5) ? ['Check it', 'go', 'meds'] : null},
      {ok:!Care.uneven(c), info:c.members.length < 2, t:c.members.length < 2 ? 'Only you in the team so far' : Care.uneven(c) ? `Most planned care is with ${Care.uneven(c).m.isMe ? 'you' : firstName(Care.uneven(c).m.name)}` : 'Planned care is shared out', fix:c.members.length < 2 ? ['Add someone', 'sheet', 'member'] : Care.uneven(c) ? ['See the balance', 'go', 'balance'] : null}];
    const need = rows.filter(r => !r.ok && !r.info).length;
    return {rows, need, word: need === 0 ? 'Care looks well covered' : need <= 2 ? 'Care is mostly covered' : 'A few things need sorting'}; }
};

Object.assign(Accounts, {
  async enableBio(acctId, dataKey){
    const S = b64(crypto.getRandomValues(new Uint8Array(32))), salt = crypto.getRandomValues(new Uint8Array(16));
    await Bio.store(acctId, S);
    this.patch(acctId, {bio:{salt:b64(salt), box:await wrapWith(await deriveKey('bio:' + S, salt, 1000), dataKey), at:Date.now()}, bioAsked:true});
  },
  async disableBio(acctId){ await Bio.forget(acctId); this.patch(acctId, {bio:null}); },
  async unlockBio(acctId){
    const a = this.list().find(x => x.id === acctId); if (!a || !a.bio) throw new Error('Not set up');
    if (!(await Bio.verify('Open Tendu'))) throw new Error('cancelled');
    const S = await Bio.read(acctId); if (!S) throw new Error('Fingerprint unlock needs setting up again. Use your PIN.');
    const key = await unwrapWith(await deriveKey('bio:' + S, unb64(a.bio.salt), 1000), a.bio.box);
    this.patch(acctId, {pinTries:0, lockUntil:0, lastIn:Date.now()}); return {acct:a, dataKey:key};
  }
});

  const since = d => c.visits.filter(v => v.memberId === d.id && daysFromToday(v.date) <= 0).map(v => v.date).sort().pop();
  c.members.filter(m => !m.isMe && m.role !== 'carer').forEach(m => { const last = since(m); if (last && daysFromToday(last) <= -14 && daysFromToday(last) >= -60) out.push({k:'vis-' + m.id + last, icon:'home', t:`${firstName(m.name)} last visited ${niceDate(last)}`, s:`${who} might enjoy seeing ${firstName(m.name)} this week.`, a:'go', v:'gperson', id:m.id}); });

SHEETS.join = () => ({title:'Join a care team', body:`<p class="muted small" style="margin:0 2px 12px">Enter the code from your invite. It looks like <b>K7M4P-Q2X9H</b>. You can also paste the whole link.</p>

  ${App.authMsg && App.sheet ? `<p class="err" role="alert">${esc(App.authMsg)}</p>` : ''}<button class="btn" type="submit">Continue</button></form>
  <details class="mt16"><summary class="small b">Got a long code starting TENDU1?</summary><form class="stack mt8" data-submit="joinTeam"><textarea class="textarea" name="code" required placeholder="TENDU1.…" style="min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem"></textarea><button class="btn ghost" type="submit">Join with the long code</button></form></details>`});
async function invLoad(raw){ if (/^TENDU1\./.test(String(raw).trim())) return {long:true};
  const code = invNorm(raw); if (!invValid(code)) throw new Error('That doesn’t look like an invite code. It has 10 letters and numbers, like K7M4P-Q2X9H.');
  const j = await invOpen(code); j.code = code; return j; }
ACTIONS.invEnter = f => busy('form[data-submit=invEnter] [type=submit]', async () => {
  try { const j = await invLoad(f.code); if (j.long) return ACTIONS.joinTeam(f); App.invite = j; openSheet('joinpreview'); }
  catch(e){ toast(e.message, 'info'); } });
const invWho = j => (j.role === 'family' && j.p) || firstName(j.n || '') || j.p || 'someone';
function invPreview(j){ const r = INV_REL.find(x => x[2] === j.role) || INV_REL[0], acc = ACCESS.find(x => x[0] === (j.acc || invDefAccess(j.role))) || ACCESS[1], who = invWho(j);
  return `<div class="center"><span class="av xl" style="--c:var(--brand-soft);color:var(--brand);margin:0 auto">${esc(initials(j.n || who))}</span>
    <h2 style="margin:12px 0 4px">${j.by ? esc(j.by) + ' invited you' : 'You’re invited'}</h2><p class="lead" style="margin:0">to help with <b>${esc(who)}’s</b> care${j.n && j.p && j.p !== j.n ? ` (${esc(j.n)})` : ''}.</p></div>
    <div class="card flat mt16" style="border-radius:16px;padding:12px 14px"><div class="small"><b>You’ll join as:</b> ${esc([j.rel, r[1]].filter((x, i, a) => x && a.indexOf(x) === i).join(' · '))}</div><div class="small mt4"><b>You’ll see:</b> ${esc(acc[2])}</div></div>
    <p class="hint mt12">${ic('lock', 'style="width:14px;height:14px;vertical-align:-2px"')} The plan and messages are encrypted on each phone. Tendu can’t read them.</p>`; }
SHEETS.joinpreview = () => { const j = App.invite; if (!j) return {title:'Invite', body:'<p class="muted">Enter the code again.</p>'};
  return {title:'Join the team', body:`${invPreview(j)}<div class="stack mt16"><button class="btn" data-a="invJoinGo">Join ${esc(invWho(j))}’s team</button><button class="btn ghost" data-a="invNotNow">Not now</button></div>`}; };
ACTIONS.invJoinGo = () => { if (App.invite) invJoin(App.invite); };
ACTIONS.invNotNow = () => { App.invite = null; LS.del(INV_PENDING); closeSheet(); };

AUTH_VIEWS.push('invited');
function invPending(){ try { const p = JSON.parse(LS.get(INV_PENDING) || 'null'); if (p && p.exp > Date.now() && invValid(p.code)) return p.code; } catch(e){} LS.del(INV_PENDING); return ''; }
const invSetPending = code => LS.set(INV_PENDING, JSON.stringify({code, exp:Date.now() + 36e5}));
(() => { const m = /join=([A-Za-z0-9-]{10,14})/.exec(location.hash || ''); if (m){ const code = invNorm(m[1]); if (invValid(code)) invSetPending(code); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} } })();
const _renderAuthInv = renderAuth; renderAuth = function(){
  if (App.authView === 'welcome' && invPending() && !App._invAuto){ App._invAuto = true; App.authView = 'invited'; setTimeout(() => ACTIONS.invPre({code:invPending()}), 0); }
  if (App.authView !== 'invited') return _renderAuthInv();
  const msg = App.authMsg ? `<p class="err" role="alert">${esc(App.authMsg)}</p>` : '', j = App.invite;
  if (j) return `<div class="auth">${authBar()}${invPreview(j)}<div class="stack mt24"><button class="btn" data-a="emStart" data-v="signup">Create my account and join</button><button class="btn ghost" data-a="emStart" data-v="signin">I already have an account</button></div>
    <p class="disclaim center">After you confirm your email, you’ll join ${esc(invWho(j))}’s team straight away.</p></div>`;
  return `<div class="auth">${authBar()}<h1>You’ve been invited</h1><p class="lead mt8">Enter the code from your invite. It looks like <b>K7M4P-Q2X9H</b>.</p>
    <form class="stack mt24" data-submit="invPre"><input class="input invin" name="code" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7M4P-Q2X9H" aria-label="Invite code" value="${esc(App._invCode ? invShow(App._invCode) : '')}" data-autofocus>${msg}<button class="btn mt8" type="submit">Continue</button></form>
    <p class="disclaim center">No code? Ask the person who invited you to send it again from Tendu Care.</p></div>`; };
ACTIONS.invPre = f => busy('form[data-submit=invPre] [type=submit]', async () => {
  try { const j = await invLoad(f.code); if (j.long){ App.authMsg = 'Long codes are entered after you sign in: More, then “Join a care team”.'; return render(); }
    App.invite = j; App._invCode = j.code; invSetPending(j.code); App.authMsg = ''; render(); }
  catch(e){ App._invCode = invNorm(f.code); App.authMsg = e.message; App.invite = null; render(); } });
const _openInv = Session.open.bind(Session); Session.open = async (...x) => { const r = await _openInv(...x); const code = invPending();
  if (code) setTimeout(async () => { if (!Session.data) return; try { const j = App.invite && App.invite.code === code ? App.invite : await invLoad(code); App.invite = j; openSheet('joinpreview'); } catch(e){ LS.del(INV_PENDING); toast(e.message, 'info'); } }, 450);
  return r; };
window.addEventListener('hashchange', () => { const m = /join=([A-Za-z0-9-]{10,14})/.exec(location.hash); if (!m) return; const code = invNorm(m[1]); if (!invValid(code)) return; invSetPending(code);
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (Session.data) invLoad(code).then(j => { App.invite = j; openSheet('joinpreview'); }).catch(e => toast(e.message, 'info')); else { App.authView = 'invited'; App._invAuto = true; render(); ACTIONS.invPre({code}); } });

const _chatViewInv = chatView; chatView = function(c){ let h = _chatViewInv(c); const joined = c.members.filter(m => !m.isMe && m.acct).length, w = invWaiting(c).length;
  if (joined) return h;
  h = h.replace(/<div class="card accent small" style="padding:12px 14px"><b>Chat on every phone\.<\/b>[\s\S]*?<\/div><\/div>/, '');
  return h.replace('<div class="chat mt12">', `<div class="card accent mt12" style="padding:14px 16px"><b>Build ${esc(whoName(c))}’s support network</b><p class="small" style="margin:6px 0 10px">Invite family, friends, neighbours or carers. Each person gets a short code and a link, and joins in a minute.${w ? ` ${w} ${w === 1 ? 'invite is' : 'invites are'} waiting.` : ''}</p><button class="btn sm" data-a="sheet" data-v="invite">${ic('users')}Invite someone</button></div><div class="chat mt12">`); };
const _membersInv = PAGES.members; PAGES.members = c => { const h = _membersInv(c), w = invWaiting(c);
  const status = c.members.filter(m => !m.isMe).map(m => m.acct ? '' : m.invitedAt ? '' : m).filter(Boolean);
  return h + `<div class="section"><div class="sechead"><h2>Invites</h2><button class="more" data-a="sheet" data-v="invite">New invite</button></div>
    ${w.length ? `<div class="list">${w.map(i => `<div class="li"><span class="tile c-accent">${ic('users')}</span><span class="main"><div class="ttl">${esc(i.name || 'Anyone with the code')}</div><div class="sub">Waiting to join · code ${esc(invShow(i.code))} · ${Math.max(1, Math.ceil((i.exp - Date.now()) / 864e5))} days left</div></span><button class="textbtn small" data-a="invResend" data-id="${i.id}">Send</button><button class="textbtn small" data-a="invCancel" data-id="${i.id}" style="color:var(--crit)">Cancel</button></div>`).join('')}</div>`
      : `<p class="small muted" style="margin:0 2px">${status.length ? `${esc(status.map(m => firstName(m.name)).join(', '))} ${status.length === 1 ? 'isn’t' : 'aren’t'} on Tendu yet. ` : ''}Invite people with a short code. They join in a minute.</p>`}</div>`; };
const _memberSheetInv = SHEETS.member; SHEETS.member = (c, p) => { const s = _memberSheetInv(c, p), m = p && p.id && member(p.id, c);
  if (!m || m.isMe || m.acct || !invSrv()) return s;
  return {...s, body:s.body + `<button class="btn ghost mt12" data-a="invFor" data-id="${m.id}">${ic('users')}Invite ${esc(firstName(m.name))} to Tendu Care</button>`}; };
ACTIONS.invFor = (v, id) => { App.invForm = {mid:id, rel:'family'}; ACTIONS.invWho('', id); openSheet('invite'); };
const _whoNameInv = whoName; whoName = c => (c && c.callAs) || _whoNameInv(c);

(function boot(){
  const accts = Accounts.list(), last = accts.find(a => a.id === LS.get('tendu.last'));
  App.authView = last && !last.archived ? (last.pin ? 'pin' : 'email') : 'welcome'; if (App.authView === 'email') App.em = {flow:'signin', email:last.email};
  const _go = go; go = function(name, params){ if (name === 'newcircle') App.onb = {step:1}; return _go(name, params); };
  render();
  if (window.claude && window.claude.use){ window.claude.use('sample').then(s => { App.ai = s || null; }).catch(() => {}); }
  if (!window.crypto || !crypto.subtle){ document.getElementById('app').innerHTML = '<div class="auth"><h1>Tendu needs a secure connection</h1><p class="lead">Please open Tendu from its app or a secure (https) link.</p></div>'; }
})();

</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:' && !window.Capacitor){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script></body></html>
